<style>
/* Путь в дизайн — стили. Мотив: мастерская дизайнера (бумага, краска, линейка, метки приводки, цветовые образцы). */
:root {
  --bg: #F3F5F1;
  --surface: #FFFFFF;
  --ink: #1A2233;
  --ink-2: #5A6375;
  --line: #D6DBD2;
  --accent: #C8006B;
  --on-accent: #FFFFFF;
  --accent-soft: rgba(200, 0, 107, .08);
  --font-head: "Bahnschrift", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", Arial, sans-serif;
  --side: 272px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161F; --surface: #1A2030; --ink: #E8EBF2; --ink-2: #A3ABBD; --line: #2C3446;
    --accent: #FF4FA3; --on-accent: #12161F; --accent-soft: rgba(255, 79, 163, .12);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12161F; --surface: #1A2030; --ink: #E8EBF2; --ink-2: #A3ABBD; --line: #2C3446;
  --accent: #FF4FA3; --on-accent: #12161F; --accent-soft: rgba(255, 79, 163, .12);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { font-size: 112.5%; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 1rem/1.6 var(--font-body);
  overflow-x: hidden;
}
img, svg { max-width: 100%; }
a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: .18em; overflow-wrap: anywhere; }
a:hover { text-decoration-thickness: 2px; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[tabindex="-1"]:focus { outline: none; }
p, li, dd { max-width: 72ch; }
p { margin: 0 0 .8em; }
ul, ol { padding-left: 1.3em; margin: 0 0 1em; }
li { margin: .3em 0; }
li::marker { color: var(--ink-2); }
small, .muted { color: var(--ink-2); }
.num, td, .tabular { font-variant-numeric: tabular-nums; }

h1, h2, h3, .head-font {
  font-family: var(--font-head); font-stretch: 87.5%; font-weight: 600;
  line-height: 1.15; letter-spacing: 0; color: var(--ink);
}
h1 { font-size: clamp(2rem, 1.3rem + 2.6vw, 2.8rem); margin: 0 0 .35em; }
h2 { font-size: 1.6rem; margin: 2.2em 0 .6em; }
h3 { font-size: 1.22rem; margin: 1.5em 0 .45em; }
h2 + h3 { margin-top: .6em; }

/* ---------- каркас ---------- */
.app { min-height: 100vh; }
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 8px;
  height: 58px; padding: 0 8px 0 16px;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.topbar .brand { flex: 1; min-width: 0; text-decoration: none; color: var(--ink); font: 600 1.15rem/1 var(--font-head); font-stretch: 87.5%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn {
  display: inline-grid; place-items: center; width: 44px; height: 44px; padding: 0;
  border: 0; border-radius: 4px; background: transparent; color: var(--ink); cursor: pointer;
}
.icon-btn svg { width: 24px; height: 24px; }
.icon-btn:hover { background: var(--accent-soft); }

.sidebar {
  position: fixed; inset: 0 auto 0 0; z-index: 40; width: min(86vw, 320px);
  display: flex; flex-direction: column; gap: 20px;
  padding: 20px 16px 24px; overflow-y: auto;
  background: var(--surface); border-right: 1px solid var(--line);
  transform: translateX(-102%); visibility: hidden;
}
.sidebar.open { transform: none; visibility: visible; }
.scrim { position: fixed; inset: 0; z-index: 30; background: rgba(10, 14, 22, .45); }
.side-brand { text-decoration: none; color: var(--ink); display: block; }
.side-brand b { display: block; font: 600 1.5rem/1.1 var(--font-head); font-stretch: 87.5%; }
.side-brand span { color: var(--ink-2); font-size: .9rem; }
.side-close { align-self: flex-end; margin: -8px -4px -12px 0; }

.nav ol { list-style: none; margin: 0; padding: 0; }
.nav li { margin: 0; max-width: none; }
.nav a {
  display: flex; align-items: baseline; gap: 10px;
  padding: .5em .6em .5em .75em; border-left: 3px solid transparent;
  color: var(--ink); text-decoration: none; border-radius: 0 4px 4px 0;
}
.nav a:hover { background: var(--accent-soft); }
.nav a[aria-current="page"] { border-left-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.nav .nav-n { color: var(--ink-2); font-size: .8rem; min-width: 1.2em; font-variant-numeric: tabular-nums; }

.side-foot { margin-top: auto; display: grid; gap: 8px; font-size: .88rem; color: var(--ink-2); }
.side-foot .btn { justify-content: flex-start; width: 100%; }
.storage-warn { color: var(--accent); }

main { padding: 24px 16px 96px; max-width: 800px; outline: none; }

@media (min-width: 960px) {
  .topbar, .scrim, .side-close { display: none !important; }
  .sidebar { transform: none; visibility: visible; width: var(--side); position: fixed; }
  main { margin-left: var(--side); padding: 52px 56px 120px; }
}

/* ---------- элементы ---------- */
.lead { font-size: 1.12rem; color: var(--ink-2); }
.stamp { display: inline-block; margin: .2em 0 0; padding: .15em .5em; border: 1px solid var(--line); border-radius: 3px; font-size: .85rem; color: var(--ink-2); }
.page-head { margin-bottom: 1.6em; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .5em;
  min-height: 44px; padding: .5em 1.05em;
  border: 1.5px solid var(--ink); border-radius: 4px; background: transparent; color: var(--ink);
  font: 600 .95rem/1.2 var(--font-body); text-decoration: none; cursor: pointer;
}
.btn:hover { background: var(--accent-soft); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn-primary:hover { background: var(--accent); filter: brightness(1.08); }
.btn-sm { min-height: 38px; padding: .35em .8em; font-size: .88rem; }
.btn-quiet { border-color: var(--line); color: var(--ink-2); }
.btn svg { width: 18px; height: 18px; flex: none; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 1.2em 0; }

.sec { scroll-margin-top: 72px; }
.toc { list-style: none; padding: 0; margin: 0 0 1.5em; display: flex; flex-wrap: wrap; gap: 6px 8px; }
.toc li { margin: 0; }
.toc a { display: inline-block; padding: .25em .7em; border: 1px solid var(--line); border-radius: 999px; color: var(--ink); text-decoration: none; font-size: .9rem; background: var(--surface); }
.toc a:hover { border-color: var(--accent); color: var(--accent); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 16px 18px; }
.card > :last-child { margin-bottom: 0; }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
.plain { list-style: none; padding: 0; }
.kv { display: grid; grid-template-columns: fit-content(14em) minmax(0, 1fr); gap: .35em 1em; margin: .6em 0; }
.kv dt { color: var(--ink-2); }
.kv dd { margin: 0; min-width: 0; }
@media (max-width: 640px) {
  .kv { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .kv dt { font-weight: 600; margin-top: .45em; }
}
.note { color: var(--ink-2); font-size: .94rem; }
.src { color: var(--ink-2); font-size: .84rem; margin-top: .4em; }
.src a { color: var(--ink-2); }
.tag { display: inline-block; padding: .1em .5em; border-radius: 3px; background: var(--accent-soft); color: var(--accent); font-size: .8rem; font-weight: 600; }
.badge { display: inline-block; padding: .05em .45em; border: 1px solid var(--line); border-radius: 3px; font-size: .78rem; color: var(--ink-2); white-space: nowrap; }
.alert { border: 2px solid var(--accent); border-radius: 4px; padding: 14px 18px; background: var(--surface); margin: 1em 0 1.5em; }
.alert h2, .alert h3 { margin-top: 0; }
.formula { font-family: var(--font-head); font-stretch: 87.5%; font-size: 1.08rem; padding: .7em 1em; border-left: 3px solid var(--ink); background: var(--surface); }
.pull { font-size: 1.1rem; }
.split { display: grid; gap: 14px; }
@media (min-width: 700px) { .split { grid-template-columns: 1fr 1fr; } }

/* таблицы */
.tbl-wrap { margin: .8em 0 1.2em; }
.tbl { width: 100%; border-collapse: collapse; font-size: .93rem; }
.tbl th { text-align: left; font-weight: 600; color: var(--ink-2); border-bottom: 2px solid var(--ink); padding: .4em .7em .4em 0; vertical-align: bottom; }
.tbl td { border-bottom: 1px solid var(--line); padding: .55em .7em .55em 0; vertical-align: top; }
.tbl td.r, .tbl th.r { text-align: right; }
.tbl tr.hl td { background: var(--accent-soft); }
@media (max-width: 640px) {
  .tbl.stack thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .tbl.stack tr { display: block; padding: .6em 0; border-bottom: 1px solid var(--line); }
  .tbl.stack td { display: block; border: 0; padding: .1em 0; text-align: left !important; }
  .tbl.stack td[data-label]::before { content: attr(data-label) ": "; color: var(--ink-2); font-weight: 600; }
}

/* чек-листы и шаги */
.check { position: relative; display: flex; gap: 12px; align-items: flex-start; cursor: pointer; padding: .35em 0; }
.check input { position: absolute; opacity: 0; width: 22px; height: 22px; margin: 0; left: 0; top: .45em; }
.box {
  flex: 0 0 22px; height: 22px; margin-top: .18em;
  display: grid; place-items: center;
  border: 2px solid var(--ink-2); border-radius: 3px; background: var(--surface);
}
.check input:checked + .box { background: var(--accent); border-color: var(--accent); }
.check input:checked + .box::after { content: ""; width: 6px; height: 11px; border: solid var(--on-accent); border-width: 0 2.5px 2.5px 0; transform: translateY(-1px) rotate(45deg); }
.check input:focus-visible + .box { outline: 3px solid var(--accent); outline-offset: 2px; }
.check input:checked ~ .check-text { color: var(--ink-2); }
.checklist { list-style: none; padding: 0; }
.checklist li { margin: 0; border-bottom: 1px solid var(--line); }
.count { font-variant-numeric: tabular-nums; color: var(--ink-2); font-size: .95rem; }

.steps { list-style: none; padding: 0; margin: 1em 0; counter-reset: step; }
.step { position: relative; padding: 14px 0 16px; border-bottom: 1px solid var(--line); max-width: none; margin: 0; }
.step-title { font: 600 1.2rem/1.25 var(--font-head); font-stretch: 87.5%; }
.step-meta { display: block; color: var(--ink-2); font-size: .88rem; margin-top: .15em; }
.step-body { margin: .5em 0 0 34px; }
.step-body p { margin: .3em 0; }
.step-done { color: var(--ink-2); }
.step-done b { color: var(--ink); font-weight: 600; }
.step .ms { display: inline-flex; align-items: center; gap: 6px; margin-top: .4em; color: var(--accent); font-weight: 600; font-size: .92rem; }
.step .ms svg { width: 20px; height: 20px; }

/* линейка прогресса */
.ruler { position: relative; padding-top: 30px; margin: 10px 13px 6px; --total: 52; }
.ruler-track {
  position: relative; height: 34px; overflow: hidden;
  border: 1.5px solid var(--ink); border-radius: 2px; background-color: var(--surface);
  background-image:
    repeating-linear-gradient(90deg, var(--ink) 0 1.5px, transparent 1.5px calc(400% / var(--total))),
    repeating-linear-gradient(90deg, var(--ink-2) 0 1px, transparent 1px calc(100% / var(--total)));
  background-size: 100% 14px, 100% 8px;
  background-repeat: no-repeat;
}
.ruler-fill { position: absolute; left: 0; bottom: 0; height: 15px; width: 0; background: var(--accent); }
.ruler.animate .ruler-fill { transition: width 1.1s cubic-bezier(.2, .7, .2, 1); }
@media (prefers-reduced-motion: reduce) { .ruler.animate .ruler-fill { transition: none; } }
.mark { position: absolute; top: 0; width: 26px; transform: translateX(-50%); color: var(--ink-2); line-height: 0; }
.reg { max-width: none; }
.mark.is-done { color: var(--accent); }
.reg { width: 26px; height: 26px; border-radius: 50%; background: var(--bg); }
.mark .reg { background: transparent; }
.ruler-scale { display: flex; justify-content: space-between; color: var(--ink-2); font-size: .8rem; margin-top: 4px; font-variant-numeric: tabular-nums; }
.ms-legend { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 6px; }
.ms-legend li { display: flex; align-items: center; gap: 8px; margin: 0; }
.ms-legend svg { width: 22px; height: 22px; flex: none; color: var(--ink-2); }
.ms-legend li.is-done svg { color: var(--accent); }
.ms-legend .ms-when { color: var(--ink-2); font-size: .9rem; }
.ms-legend .ms-ok { color: var(--accent); font-weight: 600; font-size: .9rem; }
.progress-stats { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--ink-2); font-size: .95rem; margin-top: 10px; }

/* образцы направлений */
.swatches { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); margin: 1em 0; }
.swatch {
  display: grid; grid-template-rows: 84px 1fr;
  border: 1px solid var(--line); border-radius: 4px; overflow: hidden;
  background: var(--surface); color: var(--ink); text-decoration: none;
}
.swatch:hover { border-color: var(--ink); }
.swatch-plate { background: var(--sw); }
.swatch-body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; }
.swatch-title { font: 600 1.25rem/1.15 var(--font-head); font-stretch: 87.5%; margin: 0; }
.swatch-body p { margin: 0; color: var(--ink-2); font-size: .92rem; }
.swatch .tag { align-self: flex-start; }
.dir-head { border: 1px solid var(--line); border-radius: 4px; overflow: hidden; background: var(--surface); margin-bottom: 1.4em; }
.dir-head .swatch-plate { height: 96px; }
.dir-head-body { padding: 16px 18px 18px; }
.dir-head-body h1 { margin-bottom: .2em; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: .6em 0 1em; }
.chip {
  display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: .3em .8em;
  border: 1.5px solid var(--line); border-radius: 4px; background: var(--surface); color: var(--ink);
  font: 500 .92rem/1.2 var(--font-body); cursor: pointer; text-decoration: none;
}
.chip i { width: 14px; height: 14px; border-radius: 2px; background: var(--sw, var(--ink-2)); flex: none; }
.chip[aria-pressed="true"] { border-color: var(--ink); font-weight: 600; box-shadow: inset 0 -3px 0 var(--accent); }

/* шкалы 1–5 */
.scales { margin: 0; display: grid; gap: 3px; }
.scale { display: grid; grid-template-columns: 5.5em auto 1fr; align-items: center; gap: 8px; font-size: .86rem; }
.scales.wide .scale { grid-template-columns: 11em auto 1fr; font-size: .95rem; }
.scale dt { color: var(--ink-2); }
.scale dd { margin: 0; display: contents; }
.pips { display: inline-flex; gap: 3px; }
.pips i { width: 16px; height: 8px; background: var(--line); }
.pips i.on { background: var(--ink); }
.scale .num { color: var(--ink-2); }
.legend-dl { display: grid; grid-template-columns: max-content 1fr; gap: .2em 1em; font-size: .95rem; }
.legend-dl dt { font-weight: 600; }
.legend-dl dd { margin: 0; color: var(--ink-2); }

/* тест */
.q { border: 0; border-top: 1px solid var(--line); margin: 0; padding: 18px 0 8px; }
.q legend { padding: 0; font: 600 1.25rem/1.25 var(--font-head); font-stretch: 87.5%; margin-bottom: 10px; }
.q-num { display: block; font: 400 .85rem/1.4 var(--font-body); color: var(--ink-2); margin-bottom: 4px; }
.opt { display: flex; gap: 12px; align-items: flex-start; padding: 10px 12px; margin: 6px 0; border: 1.5px solid var(--line); border-radius: 4px; background: var(--surface); cursor: pointer; }
.opt input { margin: .3em 0 0; width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
.opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.quiz-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin: 18px 0; }
.result { margin: 1.5em 0; }
.result-item { border: 1px solid var(--line); border-radius: 4px; overflow: hidden; background: var(--surface); margin-bottom: 14px; }
.result-item .swatch-plate { height: 14px; }
.result-item .inner { padding: 14px 18px 16px; }
.result-item h3 { margin: .1em 0 .4em; font-size: 1.45rem; }

/* шаблоны */
.tpl { margin: 1.2em 0; }
.tpl-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
.tpl-head h3 { margin: 0; }
.tpl-body {
  margin: 0; padding: 14px 16px; white-space: pre-wrap; overflow-wrap: anywhere;
  font: inherit; font-size: .95rem; line-height: 1.55;
  background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 0 4px 4px 0;
}

/* ступени дохода */
.levels { list-style: none; padding: 0; margin: 1em 0; display: grid; gap: 12px; }
.level { display: grid; grid-template-columns: 44px 1fr; gap: 0 14px; margin: 0; max-width: none; padding: 14px 16px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; }
.level-n { font: 600 2rem/1 var(--font-head); font-stretch: 87.5%; color: var(--accent); }
.level h3 { margin: 0 0 .1em; }
.level-range { font: 600 1.15rem/1.3 var(--font-head); font-stretch: 87.5%; }
.level-meta { color: var(--ink-2); font-size: .9rem; margin: .2em 0 .5em; }
.level ul { margin-bottom: 0; }

/* калькулятор */
.calc { border: 1.5px solid var(--ink); border-radius: 4px; background: var(--surface); padding: 16px 18px 18px; }
.calc-fields { display: grid; gap: 12px 18px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); }
.field { display: flex; flex-direction: column; gap: 4px; }
.field-label { font-weight: 600; font-size: .92rem; }
.field-hint { color: var(--ink-2); font-size: .8rem; }
.field input, .field select, .search input, .filters select {
  width: 100%; min-height: 44px; padding: .45em .6em;
  border: 1.5px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--ink);
  font: 1rem/1.3 var(--font-body); font-variant-numeric: tabular-nums;
}
.field input:focus, .search input:focus, .filters select:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.calc-out { margin: 18px 0 12px; padding-top: 14px; border-top: 1px dashed var(--line); }
.rate { font: 600 clamp(2rem, 1.6rem + 2vw, 2.7rem)/1.05 var(--font-head); font-stretch: 87.5%; color: var(--accent); font-variant-numeric: tabular-nums; }
.rate small { font-size: .5em; color: var(--ink-2); font-weight: 400; }
.calc-lines { margin: .6em 0; padding: 0; list-style: none; color: var(--ink-2); font-size: .94rem; }
.calc-lines li { margin: .15em 0; }

/* ресурсы */
.filters { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 148px), 1fr)); margin: 10px 0 8px; }
.filters label { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; color: var(--ink-2); }
.search { margin-top: 1em; }
.search label { display: block; font-weight: 600; margin-bottom: 4px; }
.res-list { display: grid; gap: 12px; margin-top: 14px; }
.res { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 14px 16px; }
.res h3 { margin: 0 0 .2em; font-size: 1.15rem; }
.res h3 a { color: var(--ink); }
.res-meta { color: var(--ink-2); font-size: .88rem; margin: 0 0 .5em; }
.res-badges { display: flex; flex-wrap: wrap; gap: 6px; margin: .3em 0 .6em; }
.res .kv { font-size: .88rem; margin-bottom: 0; }
.res-mini { list-style: none; padding: 0; margin: .5em 0 1em; }
.res-mini li { padding: .45em 0; border-bottom: 1px solid var(--line); margin: 0; max-width: none; }
.res-mini .badge { margin-left: 4px; }
.res-mini p { margin: .15em 0 0; color: var(--ink-2); font-size: .9rem; }

.bars { list-style: none; padding: 0; margin: .8em 0; display: grid; gap: 6px; }
.bars li { display: grid; grid-template-columns: 10em 1fr 2.5em; align-items: center; gap: 10px; margin: 0; max-width: none; font-size: .92rem; }
.bars .bar { height: 10px; background: var(--line); position: relative; }
.bars .bar i { position: absolute; inset: 0 auto 0 0; background: var(--ink); }
.bars .num { text-align: right; color: var(--ink-2); }

.stages { list-style: none; padding: 0; display: grid; gap: 12px; }
.stages li { margin: 0; max-width: none; }
.stage { display: grid; grid-template-columns: 40px 1fr; gap: 0 12px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); color: var(--ink); text-decoration: none; }
.stage:hover { border-color: var(--ink); }
.stage-n { font: 600 1.8rem/1 var(--font-head); color: var(--accent); }
.stage b { display: block; font: 600 1.2rem/1.2 var(--font-head); font-stretch: 87.5%; }
.stage span { color: var(--ink-2); font-size: .92rem; }

details.topic, details.more { border-top: 1px solid var(--line); }
details.topic:last-of-type { border-bottom: 1px solid var(--line); }
details > summary { cursor: pointer; padding: 14px 0; list-style: none; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
details > summary::-webkit-details-marker { display: none; }
details > summary::after { content: "+"; font: 600 1.4rem/1 var(--font-head); color: var(--accent); }
details[open] > summary::after { content: "–"; }
details > summary h2, details > summary h3 { margin: 0; }
.topic-body { padding: 0 0 18px; }
.page-foot { margin-top: 3em; padding-top: 1.2em; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 10px; align-items: center; color: var(--ink-2); font-size: .9rem; }

.toast {
  position: fixed; left: 50%; bottom: 24px; z-index: 60; transform: translateX(-50%);
  max-width: calc(100vw - 32px); padding: .65em 1.1em; border-radius: 4px;
  background: var(--ink); color: var(--bg); font-weight: 600; font-size: .95rem;
  opacity: 0; pointer-events: none;
}
.toast.show { opacity: 1; }
.noscript { padding: 24px; font-size: 1.1rem; }
.print-head { display: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .ruler-fill { transition: none !important; }
}

x-2026","title":"Ставки подоходного налога с доходов физических лиц в 2026 году","publisher":"МНС Республики Беларусь","date":"2026-02-09","url":"https://nalog.gov.by/news/34207/","note":"13% — с годовых доходов до 350 000 BYN; 25% и 30% — со сверхдоходов"},{"id":"fszn-1","title":"Кто и в каком объеме платит взносы в ФСЗН, пояснили в Минтруда","publisher":"pravo.by","date":"2024-11-19","url":"https://pravo.by/novosti/obshchestvenno-politicheskie-i-v-oblasti-prava/2024/november/79609/","note":"«1 % от заработной платы идет на пенсионное страхование» — удерживается с работника"}],"foundation":{"intro":"Фундамент нужен в любом направлении: именно его проверяют в тестовых и видят в портфолио с первого взгляда. Около 45 часов — это первые 6–7 недель при 7 часах в неделю. Дальше насмотренность и ИИ идут фоном, по чуть-чуть каждую неделю.","topics":[{"id":"f-composition","title":"Композиция и иерархия","hours":8,"why":"Человек смотрит на макет 2–3 секунды. Композиция решает, что он заметит первым, вторым и что пропустит.","learn":["Четыре принципа: контраст, повтор, выравнивание, близость (Робин Уильямс).","Визуальная иерархия: размер, вес, цвет, положение, свободное место.","Баланс и ритм, «воздух» между группами элементов.","Фокус: один главный элемент на экран или слайд."],"practice":["Возьми 5 рекламных постов и обведи, куда смотришь первым, вторым, третьим.","Пересобери один перегруженный макет: убери половину элементов и сохрани смысл.","Сделай 3 варианта одной карточки с разными главными элементами."],"done":"Можешь объяснить, почему в твоём макете взгляд идёт именно так, и показать это на 3 работах.","resources":["b-williams","c-calarts","b-lupton"]},{"id":"f-typography","title":"Типографика","hours":8,"why":"Большая часть дизайна — это текст. Аккуратная типографика сразу отличает дизайнера от человека, который «умеет в Canva».","learn":["Кегль, интерлиньяж, длина строки (комфортно 45–75 знаков), выключка.","Шрифтовые пары: 1–2 гарнитуры на проект, контраст начертаний.","Кириллица: как выбрать шрифт с хорошей кириллицей, кавычки «ёлочки», тире и дефис, неразрывные пробелы.","Шкала размеров заголовков и текста."],"practice":["Сверстай одну и ту же афишу тремя шрифтовыми парами.","Найди в Fonts In Use 10 работ с кириллицей и разбери, почему они читаются.","Исправь типографику в чужом посте: кавычки, тире, висячие предлоги."],"done":"В твоих макетах нет «кавычек-лапок», двойных пробелов и пяти шрифтов на одной странице; есть понятная шкала размеров.","resources":["b-butterick","s-bureau","s-fontsinuse","b-kovodstvo"]},{"id":"f-color","title":"Цвет","hours":5,"why":"Цвет создаёт настроение и помогает читать макет, но мешает, если его слишком много или не хватает контраста.","learn":["Тон, насыщенность, яркость; тёплые и холодные цвета.","Палитра 60/30/10: основной, дополнительный, акцент.","Контраст текста и фона (доступность: проверка в контраст-чекере).","RGB для экрана и CMYK для печати."],"practice":["Собери 3 палитры по фото из Pinterest и проверь контраст текста.","Перекрась один макет в 3 настроения: спокойное, энергичное, премиальное."],"done":"Палитра проекта — 3–5 цветов, текст проходит проверку контраста.","resources":["t-coolors","t-contrast","t-realtimecolors"]},{"id":"f-grids","title":"Сетки и модульность","hours":5,"why":"Сетка делает макет аккуратным и ускоряет работу: элементы встают на свои места сами.","learn":["Колонки, поля, межколонники; модульная сетка.","Шаг отступов 4 или 8 px и единые отступы.","Сетки в Figma: layout grid и auto layout."],"practice":["Разбери сетку 3 сайтов из Land-book: сколько колонок и какие отступы.","Сверстай одну страницу на 12-колоночной сетке и мобильную версию на 4 колонках."],"done":"Все твои макеты собраны на сетке, отступы повторяются по системе.","resources":["s-landbook","c-figma-learn"]},{"id":"f-figma","title":"Figma: рабочий минимум","hours":12,"why":"Figma — основной инструмент почти во всех вакансиях выборки: от карточек маркетплейсов до интерфейсов.","learn":["Фреймы, слои, группы, ограничения (constraints).","Auto layout: отступы, выравнивание, адаптивность.","Компоненты и варианты, стили цвета и текста.","Экспорт, комментарии, совместная работа, прототипы (базово)."],"practice":["Собери кнопку с вариантами (обычная, наведение, неактивная).","Сделай карточку товара на auto layout, которая не ломается от длинного названия.","Создай мини-библиотеку: 5 цветов, 4 стиля текста, 3 компонента."],"done":"Можешь собрать экран из компонентов и изменить стиль во всём файле за минуту.","resources":["c-figma-learn","t-figma","yt-figma","t-penpot"]},{"id":"f-eye","title":"Насмотренность","hours":1,"hoursNote":"1 час в неделю постоянно","why":"Вкус тренируется: чем больше хороших работ разобрано по косточкам, тем увереннее решения. Работодатели прямо пишут «насмотренность» в требованиях.","learn":["Собирай не «красивое», а решения: как сделан акцент, как устроена сетка, что с текстом.","Разбор по схеме: задача → приём → почему работает → как применить у себя.","Смотри и топ своего направления, и соседние области (типографика, фото, архитектура)."],"practice":["10 минут в день: 3 работы в коллекцию с подписью «что здесь работает».","Раз в неделю — 1 копия чужой работы для тренировки (только в учебных целях, без публикации как своей)."],"done":"Есть коллекция из 100+ разобранных работ по твоему направлению.","resources":["s-behance","s-dribbble","s-pinterest","s-awwwards","s-godly","b-kleon-steal"]},{"id":"f-ai","title":"ИИ в работе дизайнера","hours":4,"why":"В выборке вакансий ИИ-инструменты встречаются почти в каждом направлении: генерация фонов и иллюстраций, AI-видео, помощь с текстами и идеями. Figma называет главной темой 2026 года работу дизайнеров в эпоху ИИ.","learn":["Где ИИ помогает: варианты идей, фоны и предметные сцены, черновые тексты, ресайзы, исследование конкурентов.","Где не заменяет: понимание задачи клиента, композиция, вкус, проверка деталей.","Права и честность: проверяй условия сервиса для коммерческого использования, не выдавай генерацию за фото товара, если это вводит покупателя в заблуждение.","Доступность из Беларуси: ChatGPT (OpenAI) официально не поддерживает Беларусь — перед работой проверяй, что сервис доступен и разрешён в твоей стране."],"practice":["Сделай один учебный проект с ИИ и без него и сравни время и качество.","Собери личную шпаргалку промптов для своего направления."],"done":"Можешь показать в кейсе, где помог ИИ, а что сделано руками.","sources":["figma-sotd-2026","openai-countries"],"resources":["s-nng"]}]},"directions":[{"id":"marketplace","title":"Дизайн для маркетплейсов","short":"Карточки товаров, инфографика и рич-контент для Wildberries, Ozon и Яндекс Маркета","color":"#F2B705","what":"Делает «упаковку» товара на маркетплейсе: главное фото-обложку, слайды с инфографикой, рич-контент и баннеры магазина. Задача — чтобы покупатель за пару секунд понял, что это за товар и чем он лучше, и нажал на карточку.","why":{"text":"Продавцы маркетплейсов — массовый и постоянный заказчик. На Kwork в рубрике «Дизайн для маркетплейсов» 15 033 готовых услуги — больше, чем в любой другой проверенной дизайнерской рубрике (логотипы — 6 213, веб-дизайн — 3 954). На бирже заказов задачи на инфографику для WB появляются каждый день. Обратная сторона: огромная конкуренция — на один такой заказ 14.10.2026 пришёл 31 отклик при бюджете до 500 ₽.","sources":["kwork-catalog","kwork-projects"]},"vacancies":{"RU":{"all":74,"noExp":5,"y13":55},"BY":{"all":0,"noExp":0,"y13":0},"src":["hh-ru","rabota-by"]},"scores":{"entry":5,"ceiling":2,"hiring":2,"comment":"Самый быстрый путь к первым деньгам, но потолок низкий, если не расти в бренд-дизайн и аналитику карточек. В Беларуси штатных вакансий по этому названию нет — найм в основном удалённо, в российских компаниях-продавцах."},"skills":["Иерархия на маленьком превью: карточка в ленте занимает пару сантиметров экрана","Короткие продающие тезисы и типографика для них","Работа с фото товара: вырезка, ретушь, тени, свет","Анализ конкурентов и понимание CTR (кликабельности) и конверсии","Требования площадок к изображениям и тексту","Шаблоны-системы в Figma, чтобы быстро делать серии","Генерация фонов и сцен нейросетями с проверкой на реалистичность"],"tools":[{"name":"Figma","note":"основной инструмент: сетка 3:4, шаблоны, компоненты"},{"name":"Photopea или Photoshop","note":"вырезка и ретушь товара; Photopea бесплатна в браузере"},{"name":"Нейросети для фонов и сцен","note":"проверь доступность из Беларуси и правила коммерческого использования"},{"name":"Сами маркетплейсы и Pinterest","note":"насмотренность: топ-карточки в своей категории"}],"money":{"freelance":[{"task":"Слайд инфографики / главное фото","start":"медиана 1 000 ₽ (≈ 36 BYN), четверть услуг — 500 ₽ (≈ 18 BYN)","upper":"верхняя четверть — от 1 500 ₽ (≈ 54 BYN)","src":"kwork-catalog"},{"task":"Рич-контент Ozon","start":"отдельные услуги — от 3 000 ₽ (≈ 108 BYN)","upper":"зависит от числа блоков","src":"kwork-catalog"},{"task":"Инфографика в Беларуси","start":"на Kufar предлагают «от 10–14 р.» за слайд — это демпинг, ориентироваться на него не стоит","upper":"","src":"kufar-design"}],"avgCheck":"Публичной статистики среднего чека по рубрике нет. Типовой заказ — одна карточка из 5–8 слайдов, то есть цена слайда × количество слайдов (за серию часто дают скидку).","salary":[{"market":"Россия","level":"опыт 1–3 года","value":"медиана 73 750 ₽ (≈ 2 655 BYN) в месяц","n":44,"src":"hh-ru"},{"market":"Россия","level":"без опыта","value":"4 вакансии, 15–30 тыс. ₽ — в основном частичная занятость","n":4,"src":"hh-ru"},{"market":"Беларусь","level":"любой","value":"вакансий с таким названием на 14.10.2026 нет","n":0,"src":"rabota-by"}]},"employers":["Портфолио карточек обязательно — лучше в категории компании (косметика, дом, электроника, еда)","Photoshop и Figma; иногда Illustrator, InDesign, CorelDRAW","Понимание «продающего» дизайна, CTR и конверсии","Работа с нейросетями: генерация фонов и сцен, доработка изображений","Рич-контент и бренд-зоны — ч ба об отзыве.","done":"Заказ оплачен полностью, чек в «Профдоходе» сформирован, отзыв получен."},{"id":"mp-8","phase":"stable","title":"Стабильный доход","weeks":16,"milestone":"m2","action":"Довести до 3+ постоянных клиентов: пакеты «обложка + серия + рич-контент», абонемент на новые товары.","done":"3 месяца подряд доход не ниже 2-й ступени, половина заказов — от повторных клиентов."},{"id":"mp-9","phase":"hiringprep","title":"Подготовка к найму","weeks":6,"action":"Собрать кейсы с цифрами (CTR, продажи до/после — если клиент поделился), добавить рич-контент и упаковку, сделать резюме под in-house «дизайнер маркетплейсов».","done":"2–3 кейса с результатом, резюме, сопроводительное письмо и список 30 компаний-продавцов."},{"id":"mp-10","phase":"offer","title":"Оффер","weeks":8,"milestone":"m3","action":"Откликаться на вакансии (Россия — удалённо, Беларусь — бренды и агентства), делать тестовые, проходить собеседования.","done":"Есть оффер на позицию junior-дизайнера."}],"projects":[{"title":"Серия для товара для дома","brief":"Возьми реальный товар (например, органайзер или увлажнитель). Разбери топ-10 конкурентов и сделай главное фото и 6 слайдов: выгоды, характеристики, размеры, комплектация, сценарии использования.","result":"7 слайдов 900×1200 и 2 варианта обложки для A/B-теста.","forHiring":"Показывает анализ конкурентов и продающую логику — то, что спрашивают в вакансиях."},{"title":"Редизайн слабой карточки","brief":"Найди карточку с хорошим товаром, но слабым оформлением. Сделай «до/после» и опиши, что мешало покупателю.","result":"Слайд «до/после» и 5 гипотез, почему вырастет кликабельность.","forHiring":"Кейс с аргументацией решений, а не только «красиво»."},{"title":"Рич-контент для бренда косметики","brief":"Придумай мини-гайд бренда (цвета, шрифты, стиль фото) и собери рич-контент для Ozon из 4–5 блоков на 2 товара линейки.","result":"Единый стиль на 2 товара и блоки рич-контента.","forHiring":"In-house брендам важны системность и единый стиль."},{"tit та для будущей анимации."},{"id":"mo-2","phase":"tools","title":"Инструменты","hours":56,"action":"12 принципов анимации; Jitter для быстрых анимаций; DaVinci Resolve для монтажа; основы Blender или After Effects (если есть доступ).","done":"10 коротких упражнений: мяч, текст, логотип, переходы."},{"id":"mo-3","phase":"projects","title":"Учебные проекты","hours":70,"action":"Сделать 3 проекта из списка ниже.","done":"3 ролика по 5–30 секунд в нужных форматах."},{"id":"mo-4","phase":"portfolio","title":"Шоурил и портфолио","hours":21,"action":"Смонтировать шоурил на 30–60 секунд, кейсы на Behance, ролики на YouTube или Vimeo.","done":"Шоурил открывается по ссылке с телефона."},{"id":"mo-5","phase":"packaging","title":"Упаковка","hours":7,"action":"Профиль, пакеты (логотип / сторис / ролик), бриф на ролик, НПД.","done":"Профиль, прайс, бриф готовы."},{"id":"mo-6","phase":"search","title":"Поиск заказов","hours":42,"action":"План «Первые 30 дней» плюс 2 недели: студии и SMM-агентства на субподряд, бренды в соцсетях, Telegram-чаты.","done":"60+ сообщений, 3–5 диалогов."},{"id":"mo-7","phase":"first","title":"Первый заказ","hours":15,"milestone":"m1","action":"Первый платный ролик или анимация логотипа: раскадровка → согласование → анимация → правки.","done":"Заказ оплачен, получен отзыв."},{"id":"mo-8","phase":"stable","title":"Стабильный доход","weeks":20,"milestone":"m2","action":"Абонемент на ролики для соцсетей, партнёрства с SMM-агентствами и видеографами.","done":"3 месяца подряд доход не ниже 2-й ступени."},{"id":"mo-9","phase":"hiringprep","title":"Подготовка к найму","weeks":6,"action":"Обновить шоурил под вакансии (креативы для игр, AI-видео), описать свой рабочий процесс.","done":"Шоурил, резюме, список 20 студий и продуктовых компаний."},{"id":"mo-10","phase":"offer","title":"Оффер","weeks":10,"milestone":"m3","action":"Отклики, тестовые, собеседования.","done":"Есть оффер."}],"projects":[{"title":"Анимация логотипа в 3 стилях","brief":"Один знак — 3 анимации по 5–7 секунд: строгая, игривая, техно.","result":"3 ролика и раскадровки.","forHiring":"Быстро показывает чувство ритма."},{"title":"Рекламный креатив для мобильного приложения или игры","brief":"Вертикальный ролик 15–30 секунд, 2 варианта зацепки в первые 3 секунды.","result":"2 версии ролика.","forHiring":"Частый запрос в белорусских вакансиях."},{"title":"Анимированные сторис для бренда","brief":"5 шаблонов, которые можно менять под новые акции.","result":"Шаблоны и примеры.","forHiring":"Работа с системой, а не разовые ролики."},{"title":"Объясняющий ролик с кинетической типографикой","brief":"30–45 секунд о простом сервисе: сценарий, раскадровка, анимация, звук.","result":"Ролик и раскадровка.","forHiring":"Показывает полный цикл."},{"title":"Шоурил","brief":"30–60 секунд лучших фрагментов под музыку.","result":"Ссылка на шоурил.","forHiring":"Первое, что смотрят работодатели."}],"resources":["c-som-path","yt-benmarriott","yt-schoolofmotion","yt-mds","t-davinci","t-blender","t-jitter","t-rive","c-onskills"]}],"firstOrders":{"intro":"Первый заказ — это навык, а не удача: портфолио, понятное предложение и регулярные отклики. Ниже — всё, что нужно, с поправкой на Беларусь и рынок СНГ осенью 2026 года.","alert":{"title":"Важно: российские биржи осенью 2026","text":"С 1 октября 2026 года в России действует закон о платформенной экономике (289-ФЗ): оператор платформы обязан проверять сведения об исполнителе. По данным обзора от 30.09.2026, Kwork.ru перестал принимать продажи от исполнителей без гражданства РФ (уведомление Kwork от 29.07.2026). Правила FL.ru и других российских бирж для нерезидентов проверь в разделе «Финансы» и в поддержке до регистрации. Поэтому для Ани главные каналы — прямые клиенты, Telegram, Kufar, студии и знакомые.","sources":["law-289","kwork-by"]},"portfolio":{"howMany":"3 кейса в выбранном направлении — минимум для старта, 5 — комфортно. Лучше 3 сильных, чем 10 средних.","which":["2 кейса, похожих на реальный заказ: понятная задача, бизнес, ограничения","1 кейс «до/после»: редизайн существующей работы с аргументами","1 кейс-система: шаблоны, компоненты или гайд — показывает, что ты работаешь системно"],"caseStructure":[{"step":"Задача","text":"Кто клиент, что ему нужно и зачем. 2–3 предложения."},{"step":"Процесс","text":"Анализ конкурентов, референсы, эскизы, варианты — коротко и с картинками."},{"step":"Решение","text":"Итоговые макеты крупно и почему они такие: 3–5 аргументов."},{"step":"Результат","text":"Что получил клиент: цифры, отзыв или, для учебного проекта, что бы проверялось после запуска."}],"where":[{"name":"Behance","text":"Стандарт для графики, брендинга и маркетплейсов; заказчики и студии ищут там исполнителей."},{"name":"Dribbble","text":"Больше про UI и иллюстрацию; хорош как витрина отдельных экранов."},{"name":"Свой сайт на Tilda или Framer","text":"Обязателен для веб-дизайна; для остальных — плюс."},{"name":"PDF-портфолио на 8–12 страниц","text":"Самый удобный формат для Telegram: открывается в одно касание."},{"name":"Telegram-канал","text":"Живое портфолио: процесс, кейсы, отзывы. Работает на 2-м и 3-м этапе."}],"noProjects":["Делай учебные проекты по реальным брифам: возьми настоящий бизнес и задачу, а в портфолио честно подпиши «концепт».","Редизайн реальной карточки, сайта или презентации — с подписью «концепт, не заказ».","Проекты для знакомых и некоммерческих инициатив — с письменной договорённостью об объёме и отзыве.","Не выдавай учебные проекты за коммерческие: в СНГ дизайн-сообщество тесное, а подлог легко проверить."]},"packaging":{"items":[{"title":"Аватар","text":"Фото лица крупно, светлый фон, без фильтров. Один и тот же аватар везде."},{"title":"Имя и роль","text":"«Аня — дизайнер карточек для маркетплейсов» вместо «Аня | дизайн | творчество»."},{"title":"Био по формуле","text":"Кому помогаешь → какой результат → какая услуга → сроки и цена «от» → ссылка на портфолио."},{"title":"Услуги","text":"3 услуги с ценой «от» и сроком. Меньше выбора — легче решиться."},{"title":"Единообразие","text":"Одинаковые имя, описание и ссылки в Telegram, на Kufar, Behance и в Instagram."}],"bioExample":"Делаю карточки для Wildberries и Ozon, которые объясняют товар за 3 секунды. Серия из 7 слайдов — от 150 BYN, 3–5 дней. Портфолио: [ссылка]"},"channels":[{"name":"Знакомые и сарафанное радио","pros":"Высокое доверие, быстро, без конкуренции.","cons":"Заказов мало, неловко брать деньги.","pitfalls":"«По дружбе бесплатно» превращается в бесконечные правки. Назови цену или скидку заранее и оформи всё как обычный заказ: бриф, сроки, предоплата."},{"name":"Локальный бизнес в своём городе","pros":"Мало конкуренции, можно встретиться лично, клиенты платят в BYN.","cons":"Диалог придётся начинать самостоятельно; многие не отвечают.","pitfalls":"Не критикуй их текущий дизайн. Предложи одну конкретную идею именно для них и покажи похожую работу."},{"name":"Telegram-каналы и чаты с заказами","pros":"Много свежих заказов, без комиссии, отклик сразу автору.","cons":"Высокая конкуренция, лучшие заказы разбирают за пару часов.","pitfalls":"Встречаются мошенники: «бесплатное тестовое», оплата «после», просьба перейти по ссылке или «оплатить доступ». Работай с предоплатой и не плати за доступ к заказам."},{"name":"Kufar — раздел «Услуги»","pros":"Белорусские клиенты, оплата в BYN, объявление бесплатно.","cons":"Много демпинга (инфографика «от 10 р.»), клиенты ищут подешевле.","pitfalls":"Не соревнуйся ценой — выделяйся специализацией, портфолио и сроками."},{"name":"Российские биржи (Kwork.ru, FL.ru и другие)","pros":"Полезны как источник цен и типичных заказов.","cons":"Kwork.ru закрыл продажи для исполнителей без гражданства РФ; у других бирж правила для нерезидентов нужно проверять.","pitfalls":"Не используй чужие аккаунты и «серые» схемы вывода денег: можно потерять и деньги, и аккаунт."},{"name":"Kwork.com и международные площадки","pros":"Оплата в валюте.","cons":"Нужен английский, клиентов из СНГ мало. Upwork не работает с Беларусью с 2022 года.","pitfalls":"Перед регистрацией проверь, как выводить деньги в Беларусь и как отражать доход в НПД."},{"name":"Некоммерческие проекты","pros":"Реальные кейсы и отзывы, полезные знакомства.","cons":"Без оплаты.","pitfalls":"Ограничь объём и сроки письменно; договорись об отзыве и праве показывать работу."},{"name":"Дизайн-студии и агентства (субподряд)","pros":"Стабильный поток задач, обучение у опытных.","cons":"Ставка ниже, чем у прямых клиентов; иногда NDA.","pitfalls":"Заранее уточни, можно ли показывать работы в портфолио."},{"name":"Продавцы маркетплейсов напрямую","pros":"Для направления «маркетплейсы» — самый прямой путь.","cons":"Нужно искать контакты: соцсети и сайт бренда.","pitfalls":"Пиши тем, у кого хороший товар и слабые карточки, а не топ-брендам с отделом дизайна."}],"channelsSources":["law-289","kwork-by","upwork-by","kufar-design","habr-freelance-closed"],"noReviews":[{"title":"Отклик, который читают","text":"Первые 2 строки — про задачу клиента, а не про тебя. Дальше — 1–2 похожие работы и конкретный вопрос по задаче. Без «здравствуйте, я начинающий дизайнер»."},{"title":"Холодное сообщение","text":"Одна идея именно для этого бизнеса и короткий пример, как это может выглядеть. 5–7 строк, без вложений на 20 МБ."},{"title":"Проект за отзыв: когда уместно","text":"1–2 раза в самом начале: знакомые, некоммерческие проекты, микробизнес без бюджета. Объём фиксируется письменно, в обмен — отзыв и право показать работу."},{"title":"Проект за отзыв: когда нет","text":"Бизнес с бюджетом и рекламой, большие проекты, «потом заплатим, если понравится», бесконечные правки. Это бесплатная работа, а не кейс."},{"title":"Студии и агентства","text":"Отправь портфолио и предложи взять небольшую оплачиваемую задачу на пробу. Бесплатное «тестовое» на реальный проект клиента — красный флаг."},{"title":"Скорость","text":"В Telegram-чатах отвечай в первые 1–2 часа после публикации заказа: позже автор уже выбирает из десятков откликов."}],"pricing":{"how":["Посчитай минимальную ставку в калькуляторе раздела «Заработок».","Оцени часы на задачу и добавь 20% на правки и общение.","Сравни с рынком: если сильно ниже — ты недооцениваешь время; если сильно выше — нужно больше кейсов.","Называй цену «от» и уточняй после брифа."],"table":[{"direction":"marketplace","task":"Слайд инфографики","byn":"20–35 BYN"},{"direction":"marketplace","task":"Серия из 7 слайдов","byn":"140–250 BYN"},{"direction":"graphic","task":"Шаблон поста для соцсетей","byn":"15–30 BYN"},{"direction":"graphic","task":"Баннер в 3 форматах","byn":"35–60 BYN"},{"direction":"graphic","task":"Презентация на 10 слайдов","byn":"150–280 BYN"},{"direction":"branding","task":"Логотип: 3 концепции и доработка","byn":"200–400 BYN"},{"direction":"branding","task":"Мини-айдентика","byn":"500–1000 BYN"},{"direction":"web","task":"Лендинг: дизайн в Figma","byn":"250–450 BYN"},{"direction":"web","task":"Лендинг под ключ на Tilda","byn":"450–900 BYN"},{"direction":"uxui","task":"UX-аудит одного сценария","byn":"150–300 BYN"},{"direction":"motion","task":"Анимация логотипа 5–7 с","byn":"80–160 BYN"},{"direction":"motion","task":"Ролик для соцсетей 15–30 с","byn":"180–350 BYN"}],"tableNote":"Это наш ориентир для новичка с прямыми клиентами, а не рыночная статистика. Он посчитан из стартовых цен Kwork и Kufar на 14.10.2026 и минимальной ставки 10–25 BYN в час. Цены массовых бирж ниже, цены агентств — в разы выше."},"clientWork":[{"title":"Бриф","text":"До цены и сроков — короткий бриф: задача, аудитория, примеры, что нравится и что нет, сроки, бюджет. Шаблон ниже."},{"title":"Техническое задание","text":"По брифу составь короткое ТЗ: что входит (форматы, количество, размеры), что не входит, сроки этапов. Клиент подтверждает его письменно, в мессенджере тоже можно."},{"title":"Предоплата","text":"Новым клиентам — 50% до начала; мелкие заказы до ~50 BYN — 100%. Крупные проекты — по этапам: 30/40/30."},{"title":"Правки","text":"2 круга правок входят в цену. Дальше — по часовой ставке. Правка — это изменение в рамках ТЗ; новая задача — это новая задача."},{"title":"Сроки","text":"Закладывай +20% к своей оценке. Если клиент задерживает материалы — сроки сдвигаются, скажи об этом заранее."},{"title":"Сдача и исходники","text":"Финальные файлы — после полной оплаты. Входят ли исходники (Figma, PSD) — договорись до старта; часто это отдельная доплата."}],"legal":{"title":"Как оформиться и принимать оплату в Беларуси","intro":"Графический дизайн и разработку сайтов в Беларуси можно вести без регистрации ИП — с уплатой единого налога или налога на профессиональный доход (НПД). Для старта обычно проще НПД. Ниже — только то, что подтверждено официальными или правовыми источниками; детали уточняй в приложении и в своей налоговой инспекции.","points":[{"title":"НПД подходит для графического дизайна","text":"МНС разъясняло: графический дизайн входит в перечень видов деятельности для НПД (подп. 4.11 перечня, утверждённого постановлением Совмина № 851 от 08.12.2022). Работать нужно самостоятельно, удалённо, без нанимателя-заказчика и с передачей результата через интернет.","src":["npd-design","npd-ilex"]},{"title":"Регистрация — в приложении «Профдоход»","text":"Приложение скачивается с сайта МНС. Через него ты сообщаешь, что применяешь НПД, формируешь чек на каждый доход и платишь налог. Декларацию подавать не нужно.","src":["npd-app","npd-ilex"]},{"title":"Ставки","text":"10% — с дохода от физлиц и от иностранных организаций и ИП (в том числе из России) независимо от суммы, а также от белорусских организаций и ИП в пределах 60 000 BYN за год. 20% — с дохода от белорусских организаций и ИП сверх 60 000 BYN за год и при несвоевременном формировании чека.","src":["npd-ilex","npd-2026"]},{"title":"Минимум 45 BYN в месяц с 1 июля 2026","text":"Даже в месяц без дохода нужно заплатить не меньше 45 BYN. Поэтому регистрируйся, когда заказы стали регулярными или перед первым платным заказом, а не за полгода до него. Если долго не работаешь, в приложении есть снятие с учёта.","src":["npd-2026"]},{"title":"Вычет для новичков","text":"При первой регистрации плательщиком НПД налоговая база уменьшается на 2 000 BYN. Как вычет сочетается с минимальным налогом, уточни в приложении или в инспекции.","src":["npd-ilex"]},{"title":"Сроки","text":"Налог начисляется по чекам; уведомление приходит в приложении. Уплата — не позднее 22-го числа следующего месяца. Три неуплаты подряд — инспекция может прекратить применение НПД.","src":["npd-2026","npd-ilex"]},{"title":"Доход от клиентов из России","text":"Доход из-за рубежа на белорусском НПД облагается в Беларуси: чек формируется в белорусском приложении.","src":["npd-foreign"]},{"title":"Белорусские клиенты платят в BYN","text":"При расчётах с белорусскими заказчиками используется белорусский рубль; расчёты в валюте между резидентами-физлицами запрещены (штраф).","src":["npd-ilex"]},{"title":"Как клиенту из России перевести деньги","text":"Вариант 1: перевод по номеру телефона через российскую СБП и белорусскую систему мгновенных платежей — если оба банка подключены; в белорусском банке нужно включить приём. Вариант 2: банковский перевод на твой счёт. Комиссии и курс зависят от банков — проверь до первого заказа.","src":["belveb-smp","vtb-by"]},{"title":"Чего не делать","text":"Не принимать оплату через чужие карты и аккаунты, не выводить деньги через «серые» схемы, не работать без чеков: при нарушении сроков формирования чека применяется ставка 20%.","src":["npd-2026"]}],"more":"Ответы на частые вопросы — в разделе «Вопрос-ответ» МНС; при сомнениях — консультация в своей налоговой инспекции.","moreSrc":["nalog-qa"]},"checklist":[{"id":"fo-1","text":"Выбрано направление и одна ниша для старта"},{"id":"fo-2","text":"3 кейса в портфолио по схеме «задача → процесс → решение → результат»"},{"id":"fo-3","text":"PDF-портфолио открывается с телефона"},{"id":"fo-4","text":"Профиль: аватар, имя с ролью, био по формуле, 3 услуги с ценой «от»"},{"id":"fo-5","text":"Посчитана минимальная ставка в калькуляторе"},{"id":"fo-6","text":"Готовы шаблоны: отклик, холодное сообщение, бриф, прайс"},{"id":"fo-7","text":"Объявление на Kufar в разделе «Услуги»"},{"id":"fo-8","text":"Подписка на 3–5 Telegram-каналов и чатов с заказами"},{"id":"fo-9","text":"Список из 50 потенциальных клиентов в таблице"},{"id":"fo-10","text":"Понятно, как зарегистрироваться в «Профдоходе» и выдать чек"},{"id":"fo-11","text":"Понятно, как клиент из России и из Беларуси переведёт оплату"},{"id":"fo-12","text":"Правила работы: предоплата, 2 круга правок, исходники — отдельно"}],"plan30":[{"week":1,"title":"Упаковка и список","tasks":["Довести 3 кейса и PDF-портфолио","Оформить профиль и прайс","Собрать список из 50 потенциальных клиентов: локальный бизнес, продавцы, студии","Отправить 5 пробных откликов, чтобы обкатать шаблон"],"target":"5 откликов"},{"week":2,"title":"Регулярные отклики","tasks":["Каждый будний день смотреть Telegram-каналы с заказами","Отправить 10 откликов и 5 холодных сообщений из списка","Разместить объявление на Kufar","Записывать в таблицу: кому, когда, ответ"],"target":"15 контактов"},{"week":3,"title":"Разбор и усиление","tasks":["Посмотреть, какие отклики получили ответ, и переписать шаблон","Отправить 10 откликов и 5 холодных сообщений","Написать в 3 студии или агентства с предложением субподряда","Сделать 1 пример под нишу, где были вопросы"],"target":"18 контактов"},{"week":4,"title":"Доведение до сделки","tasks":["Повторно написать тем, кто не ответил (через 5–7 дней, одно короткое сообщение)","Отправить 10 откликов и 5 холодных сообщений","Провести 1–3 разговора: бриф, цена, сроки, предоплата","Зарегистрироваться в «Профдоходе» перед первой оплатой"],"target":"15 контактов и 1–3 разговора"}],"plan30Note":"Итого 50–55 персональных контактов за месяц: это около 3 часов в неделю на поиск, остальные 4 часа — на портфолио и обучение. Если первого заказа нет через 30 дней — это нормально: продолжай темп и улучшай отклик по таблице.","templates":[{"id":"t-reply","title":"Отклик на заказ","lines":["Здравствуйте, [имя]! Пишу по вашему заказу на [задача] для [товар / бизнес].","","Чтобы [цель клиента: выделиться в выдаче / объяснить преимущества / привлечь заявки], предлагаю [1–2 конкретные идеи].","","Похожие работы: [ссылка 1], [ссылка 2].","","Срок — [N] дней, стоимость — [сумма] (после брифа уточню). Подскажите, пожалуйста: [1 вопрос по задаче]?","","Аня, [роль]"],"note":"Меняй 2–3 строки под каждый заказ: одинаковые отклики видно сразу."},{"id":"t-cold","title":"Холодное сообщение бизнесу","lines":["Здравствуйте! Я Аня, [роль] из [город].","","В вашем [профиле / карточке / сайте] нравится [что хорошо — искренне и конкретно].","","Есть идея, как [конкретная польза: сделать первый слайд заметнее в ленте / упростить запись на сайте]. Вот быстрый пример: [ссылка или картинка].","","Если интересно — расскажу подробнее и посчитаю стоимость. Если нет — спасибо, что дочитали!"],"note":"Не критикуй текущий дизайн и не прикладывай прайс в первом сообщении."},{"id":"t-brief","title":"Бриф","lines":["Бриф на [услуга]","","1. Компания или товар: что продаёте, кому, чем отличаетесь от конкурентов?","2. Задача: что должен сделать дизайн (выделиться в выдаче, объяснить товар, вызвать доверие, привести заявки)?","3. Аудитория: кто покупатель, что для него важно?","4. Что уже есть: логотип, фирменный стиль, фото, тексты, характеристики?","5. Примеры: 2–3 работы, которые нравятся, и 1–2, которые не нравятся. Почему?","6. Обязательные элементы и ограничения (требования площадки, юридические надписи).","7. Форматы и количество: размеры, число макетов или слайдов.","8. Сроки: когда нужен результат, есть ли жёсткий дедлайн?","9. Бюджет: ориентир или диапазон.","10. Кто принимает решение и даёт правки?"],"note":"Отправь как сообщение или документ. Короткие ответы — нормально."},{"id":"t-price","title":"Прайс","lines":["Аня — [роль]","","[Услуга 1] — от [сумма] BYN, [срок] дней","Что входит: [3 пункта]","","[Услуга 2] — от [сумма] BYN, [срок] дней","Что входит: [3 пункта]","","[Услуга 3] — от [сумма] BYN, [срок] дней","Что входит: [3 пункта]","","Условия: предоплата 50%, 2 круга правок входят в стоимость, исходники — по договорённости.","Для клиентов из России — цена в RUB по курсу на день счёта.","Портфолио: [ссылка]"],"note":"Три услуги — лучше, чем десять."},{"id":"t-review","title":"Просьба об отзыве","lines":["[Имя], спасибо за работу над [проект]! Мне было важно, чтобы [результат для клиента].","","Можно попросить вас о коротком отзыве — 2–3 предложения? Например: какая была задача, как прошла работа и что получилось в итоге.","","И ещё вопрос: можно ли показать этот проект в портфолио? Если есть данные, которые нельзя раскрывать, — уберу их.","","Если понадобится [следующая услуга], — пишите, с удовольствием помогу."],"note":"Проси отзыв в день сдачи, пока впечатления свежие."}]},"growth":{"intro":"Первые заказы есть — теперь задача сделать доход регулярным и растущим. Здесь нет секретов «как зарабатывать миллион». Есть три рычага: сколько часов ты продаёшь, по какой цене и сколько времени уходит на поиск клиентов. Всё остальное в разделе — способы двигать эти рычаги.","formulaLine":"Доход в месяц = оплачиваемые часы × ставка. Оплачиваемые часы = все рабочие часы × доля, которая уходит на заказы (остальное — поиск, переписка, учёба).","niche":{"title":"Позиционирование и ниша","why":[{"title":"Клиенту проще выбрать","text":"«Дизайнер карточек для косметики» звучит понятнее и надёжнее, чем «делаю любой дизайн». Человек ищет того, кто уже решал его задачу."},{"title":"Работа идёт быстрее","text":"Похожие задачи → свои шаблоны и наработки → меньше часов на заказ → выше доход в час при той же цене."},{"title":"Портфолио убеждает сильнее","text":"5 работ для одной ниши выглядят как опыт. 5 работ в пяти разных стилях — как поиск себя."},{"title":"Клиентов легче найти","text":"Понятно, где собирается твоя аудитория: чаты селлеров, сообщества кофеен, ассоциации, профильные выставки."}],"check":{"text":"Разброс цен на одну и ту же услугу огромный. В рубрике «Презентации» на Kwork медиана стартовой цены — 1 500 ₽, а верхняя четверть начинается от 7 000 ₽ (срез 14.10.2026). В брендинге массовый рынок продаёт логотип за несколько тысяч рублей, а агентства берут за брендбук сотни тысяч. Специализация — один из способов перейти в верхнюю часть диапазона: клиент платит за опыт именно в его задаче.","sources":["kwork-catalog","branding-prices"]},"types":[{"title":"По отрасли","text":"Кофейни и пекарни, салоны красоты, стоматологии, детские центры, производители одежды."},{"title":"По задаче","text":"Только карточки, только презентации для инвесторов, только лендинги для онлайн-школ."},{"title":"По типу клиента","text":"Начинающие селлеры, локальный бизнес Минска, небольшие ИТ-продукты, эксперты и блогеры."}],"filters":[{"title":"Интерес","text":"Тебе интересно делать это хотя бы год? Без интереса ниша быстро надоест."},{"title":"Деньги у клиентов","text":"У клиентов есть бюджет и регулярная потребность? Продавцу с 50 товарами карточки нужны постоянно, а свадебному фотографу логотип — один раз."},{"title":"Доступ к клиентам","text":"Ты знаешь, где их найти и как им написать? Нишу, до которой невозможно дотянуться, сложно продать."}],"validate":["2 недели записывай в таблицу все заказы по нише в Telegram-чатах и на Kufar: сколько их и какой бюджет.","Найди 30 потенциальных клиентов и честно оцени, у скольких видна проблема, которую решает твой дизайн.","Поговори с 10 представителями ниши: что у них болит в дизайне, сколько они уже платили и кому.","Отправь 20 холодных сообщений с примером для ниши и посчитай ответы. Мало ответов — поменяй сообщение или нишу.","Сделай 2–3 работы для портфолио именно под нишу, прежде чем менять профиль целиком."],"example":{"before":"Аня — дизайнер. Логотипы, баннеры, сайты, карточки, презентации.","after":"Аня — дизайн для кофеен и пекарен: меню, вывески, соцсети. Помогаю выглядеть так, чтобы хотелось зайти.","text":"Ниша — не клетка: другие заказы брать можно. Но в профиле, портфолио и холодных сообщениях показывай нишу."},"resources":["b-enns-manifesto","b-kleon-show"]},"packages":{"title":"Оффер и пакеты услуг","intro":"Пакет — это заранее продуманный набор: что входит, сколько стоит, сколько дней. Клиенту проще выбрать из трёх понятных вариантов, чем оценивать «сколько стоит дизайн». А тебе проще считать время и не уходить в бесконечные доработки.","rules":["Базовый — минимум, который решает задачу. Стандарт — основной вариант, его хочется выбрать. Премиум — максимум с бонусами и приоритетом.","Цену каждого пакета считай в калькуляторе: часы пакета × ставка × 1,2 (запас на правки).","Стандарт делай самым выгодным по цене за единицу результата — тогда базовый и премиум работают как рамки для сравнения.","В каждом пакете пиши, что НЕ входит: это защищает от разрастания объёма."],"items":[{"direction":"marketplace","basic":"Главное фото (обложка) карточки","standard":"Серия из 7 слайдов: обложка, выгоды, характеристики, размеры, комплектация, сценарии","premium":"Серия из 7 слайдов + 2 варианта обложки для A/B-теста + адаптация под вторую площадку + Figma-шаблон для будущих товаров","upsell":"Рич-контент для Ozon, адаптация под WB или Ozon, обновление серии к сезону, шаблон для всей линейки","subscription":"Абонемент: до 15 слайдов в месяц для новых товаров и обновлений по фиксированной цене","best":"Серии и шаблоны для линейки товаров одного продавца: один стиль на десятки карточек"},{"direction":"graphic","basic":"Шаблон поста в трёх форматах: пост, сторис, обложка","standard":"9 шаблонов для соцсетей в едином стиле с редактируемыми слоями","premium":"12 шаблонов + мини-гайд на 1–2 страницы (шрифты, цвета, правила) + 4 рекламных баннера","upsell":"Баннеры в нескольких размерах, шаблон презентации, листовки и визитки, обучение SMM-специалиста работе с шаблонами","subscription":"Абонемент: 12 постов в месяц (3 в неделю) и сторис по шаблонам","best":"Презентации для компаний и наборы шаблонов: чек выше, а клиенты возвращаются"},{"direction":"branding","basic":"Логотип: 2 концепции, 2 круга правок, файлы для экрана и печати","standard":"Логотип + мини-айдентика: цвета, шрифты, 3–5 носителей (визитка, аватар, пост, бланк)","premium":"Айдентика + гайд на 10–15 страниц + шаблоны для соцсетей и презентации","upsell":"Вывеска, упаковка, меню, мерч, шаблоны для соцсетей, расширенный брендбук","subscription":"Абонемент «бренд-поддержка»: до 8 макетов в месяц в фирменном стиле — листовки, посты, баннеры","best":"Айдентика с шаблонами для конкретной ниши. Отдельный логотип на массовом рынке стоит дёшево — медиана на Kwork 3 000 ₽"},{"direction":"web","basic":"Дизайн лендинга в Figma: 5–7 блоков, версии для компьютера и телефона","standard":"Лендинг под ключ на Tilda: дизайн, сборка, адаптив, форма заявок, подключение домена","premium":"Сайт до 5 страниц или лендинг + структура текстов + метатеги и фавикон + короткое обучение клиента редактированию","upsell":"Новые страницы и блоки, второй вариант первого экрана, баннеры для рекламы сайта, перенос сайта на Tilda или Framer","subscription":"Абонемент: поддержка сайта 4 часа в месяц — правки, новые блоки, акции","best":"Лендинги под ключ для малого бизнеса одной ниши плюс ежемесячная поддержка"},{"direction":"uxui","basic":"UX-аудит одного сценария (запись, оформление заказа): 10–15 проблем со скриншотами и рекомендациями","standard":"Аудит + редизайн сценария: 5–8 экранов в Figma и кликабельный прототип","premium":"3–5 интервью или юзабилити-тест + редизайн + UI-кит компонентов для разработчиков","upsell":"Юзабилити-тест после запуска, UI-кит, мобильная версия, сопровождение разработки (ответы на вопросы, проверка вёрстки)","subscription":"Абонемент: ежемесячный аудит одного сценария или фиксированное число часов на улучшения продукта","best":"Аудит + редизайн одного сценария: понятная польза для бизнеса и вход в долгую работу"},{"direction":"motion","basic":"Анимация логотипа 5–7 секунд, 2 варианта","standard":"Ролик 15–30 секунд для соцсетей или рекламы: раскадровка, анимация, музыка из лицензионной библиотеки","premium":"Серия из 3 роликов в одном стиле + форматы 9:16, 1:1 и 16:9 + шаблон, в котором клиент сам меняет текст","upsell":"Адаптация под форматы, субтитры, анимированные стикеры и иконки, анимированные баннеры","subscription":"Абонемент: 4 ролика в месяц для соцсетей по шаблону","best":"Серии коротких роликов для соцсетей и рекламы: спрос регулярный"}],"upsellTips":["Предлагай допродажу, когда она логично продолжает задачу: после логотипа — шаблоны соцсетей, после карточек — рич-контент.","Называй её в момент сдачи, когда клиент доволен результатом, а не в середине работы.","Одна допродажа за раз, с ценой и сроком — без «давайте ещё что-нибудь сделаем»."],"subscriptionTips":["Абонемент подходит клиентам, которые заказывают чаще раза в месяц.","Фиксируй объём (число макетов или часов), срок ответа и что будет с неиспользованным объёмом (обычно сгорает).","Оплата — в начале месяца, 100% предоплата.","Цена абонемента — чуть ниже, чем те же задачи по отдельности: клиент экономит, а ты получаешь предсказуемый доход.","Пересматривай условия раз в 3 месяца."]},"pricing":{"title":"Ценообразование и рост чека","models":[{"title":"Почасовая","how":"Ставка × фактические часы.","when":"Поддержка, правки сверх лимита, субподряд, задачи с неясным объёмом.","pros":"Честно, когда объём непредсказуем.","cons":"Доход упирается в часы; чем быстрее работаешь, тем меньше получаешь; клиентов пугает «счётчик»."},{"title":"Проектная (фиксированная)","how":"Цена за результат по ТЗ: «серия из 7 слайдов — 200 BYN».","when":"Понятные типовые задачи — основная модель для фрилансера.","pros":"Клиенту понятно; когда работаешь быстрее, доход в час растёт.","cons":"Риск недооценить задачу и попасть в разрастание объёма — нужны ТЗ и запас 20%."},{"title":"Ценностная","how":"Цена от пользы для бизнеса клиента: сколько ему принесёт или сэкономит результат.","when":"С 3-й ступени: есть кейсы с цифрами, клиенты с бюджетом, задачи, влияющие на продажи.","pros":"Самый высокий потолок.","cons":"Нужны доверие, цифры и умение говорить о бизнесе. Новичку сложно — начинай с проектной."}],"modelsResources":["b-enns-manifesto","yt-futur"],"formula":{"title":"Как посчитать минимальную ставку","steps":["Оплачиваемые часы в месяц = часы в неделю × 4,33 × доля оплачиваемых часов (обычно 50–60%: остальное — поиск клиентов, переписка, учёба).","Нужная выручка = (желаемый доход «на руки» + рабочие расходы) ÷ (1 − ставка налога). Но не меньше, чем доход + расходы + минимальный налог 45 BYN.","Минимальная ставка = нужная выручка ÷ оплачиваемые часы.","Цена задачи = ставка × часы на задачу × 1,2 (запас 20% на правки и общение)."],"example":["Желаемый доход 300 BYN, 7 часов в неделю, оплачиваемых — 50%, расходы 30 BYN, налог 10%.","Оплачиваемые часы: 7 × 4,33 × 0,5 ≈ 15,2 ч.","Выручка: большее из 300 + 30 + 45 = 375 и 330 ÷ 0,9 ≈ 367 → 375 BYN. Здесь срабатывает минимальный налог.","Ставка: 375 ÷ 15,2 ≈ 24,7 BYN в час.","Шаблон поста (1,5 ч): 24,7 × 1,5 × 1,2 ≈ 45 BYN. Логотип (20 ч): 24,7 × 20 × 1,2 ≈ 594 BYN."],"note":"Если расчёт выше рынка, это нормально для 7 часов в неделю. Цену ниже расчёта можно ставить на первые 3–5 заказов ради отзывов и кейсов. Дальше рост идёт через три рычага: меньше часов на задачу (шаблоны), больше оплачиваемых часов (повторные клиенты тратят меньше времени на поиск) и выше чек (ниша, пакеты)."},"raise":{"when":["Загрузка выше 80% два месяца подряд.","Больше 40% разговоров с клиентами заканчиваются заказом — вероятно, цена ниже ожиданий.","Появилась очередь: новые заказы можно начать только через 2 недели и позже.","Появились новые кейсы, навыки или ниша.","Цены не менялись 6–12 месяцев."],"how":["Новым клиентам — новая цена сразу.","Постоянным — предупреди за 30 дней (шаблон ниже) и дай заказать по старой цене до даты повышения.","Шаг — 10–20% за раз.","Лучшим постоянным клиентам можно сохранить старую цену на пакет ещё на 1–3 месяца."],"note":"Это наши ориентиры, а не правило рынка. Главный сигнал — заказов больше, чем часов."},"noDumping":["Не опускайся ниже минимальной ставки дольше, чем на первые 3–5 заказов.","Снижай объём, а не цену: «за эту сумму могу сделать 4 слайда вместо 7».","Не участвуй в «аукционах» в чатах, где побеждает самая низкая цена.","Скидка — только в обмен на что-то: предоплату пакета, объём, отзыв с правом показать кейс.","Цены вида «инфографика от 10 р.» на Kufar — не ориентир, а демпинг."],"objections":[{"q":"«Дорого»","a":"Понимаю. Подскажите, с чем сравниваете? Если бюджет ограничен, могу предложить базовый вариант: [что входит] за [сумма]."},{"q":"«У другого дизайнера дешевле»","a":"Цены у всех разные, и это нормально. В мою стоимость входят [бриф, 2 круга правок, исходники, срок]. Если важна именно цена — могу убрать [пункт] и сделать за [сумма]."},{"q":"«Сделайте скидку»","a":"Скидку на эту работу не делаю, но могу [разбить оплату на этапы / уменьшить объём / добавить бонус при оплате пакета]."},{"q":"«Сделайте сначала бесплатно, если понравится — заплатим»","a":"Вот похожие работы: [ссылки]. Первый этап могу сделать как отдельный оплачиваемый заказ за [сумма] — так мы оба ничем не рискуем."},{"q":"«Сейчас нет бюджета»","a":"Понимаю. Когда планируете вернуться к задаче? Могу написать вам в [месяц]."}]},"channels":{"title":"Каналы привлечения: от бирж к прямым клиентам","intro":"Ступени дохода — ниже в этом разделе. Чем выше ступень, тем больше заказов приходит само (рекомендации, повторные клиенты, партнёры) и тем меньше времени уходит на поиск.","items":[{"name":"Чаты с заказами, Kufar, биржи","stages":[1,2],"how":"Ежедневный просмотр, быстрый отклик по шаблону, учёт в таблице.","tip":"Быстро дают первые заказы, но чек низкий и конкуренция высокая. С ростом сокращай их долю."},{"name":"Сарафанное радио и рекомендации","stages":[1,2,3,4],"how":"Проси рекомендацию в момент успеха и предлагай бонус за приведённого клиента — например, скидку 10% на следующий заказ.","tip":"Работает с первого заказа и всегда. Самые тёплые клиенты."},{"name":"Системный холодный аутрич","stages":[1,2,3],"how":"10 персональных сообщений в неделю по списку ниши, одно напоминание через 5–7 дней, учёт в таблице.","tip":"Медленно, но предсказуемо: сам решаешь, с кем работать."},{"name":"Партнёрства и субподряд","stages":[2,3,4],"how":"Студии, маркетологи и таргетологи, SMM-агентства, веб-разработчики, копирайтеры, фотографы товаров. Предложи им понятный пакет для их клиентов и стабильную цену.","tip":"С 2-й ступени, когда есть кейсы и понятные пакеты. Один партнёр может давать заказы месяцами."},{"name":"Личный бренд и контент","stages":[2,3,4],"how":"Telegram-канал с кейсами и процессом (1–2 поста в неделю), каждый кейс — на Behance, полезные посты в сообществах ниши.","tip":"Медленный старт, но эффект накапливается. На 7 часах в неделю — не больше 1 часа на контент."},{"name":"Сообщества ниши","stages":[1,2,3],"how":"Чаты селлеров и предпринимателей, местные бизнес-сообщества: отвечай на вопросы по дизайну, не рекламируй себя в лоб.","tip":"Тебя запоминают как эксперта, и заказы приходят из личных сообщений."}]},"funnel":{"title":"Воронка и учёт","intro":"Без таблицы ты не знаешь, какой канал приносит деньги, а какой только время. Достаточно Google Таблиц или Excel — 15 минут в неделю.","statuses":["Новый контакт","Есть ответ","Разговор / бриф","Отправлено КП","Предоплата","В работе","Сдано","Оплачено полностью","Отказ (причина)"],"fields":[{"name":"Дата первого контакта","example":"03.11.2026"},{"name":"Источник","example":"Чат с заказами / Kufar / рекомендация / холодное сообщение / партнёр"},{"name":"Клиент и контакт","example":"Кофейня «Зерно», @zerno_admin"},{"name":"Ниша","example":"Кофейни"},{"name":"Задача","example":"Меню + 6 шаблонов постов"},{"name":"Статус","example":"Отправлено КП"},{"name":"Сумма","example":"380 BYN"},{"name":"Часы по факту","example":"17"},{"name":"Следующий шаг и дата","example":"Напомнить про КП 10.11"},{"name":"Повторный клиент?","example":"Да / нет"}],"metrics":[{"name":"Средний чек","formula":"доход за месяц ÷ число оплаченных заказов","why":"Растёт с нишей, пакетами и допродажами."},{"name":"Доход в час","formula":"доход за месяц ÷ все рабочие часы (с поиском и перепиской)","why":"Главная метрика. Если 2 месяца подряд ниже минимальной ставки — пересмотри цены, нишу или каналы."},{"name":"Загрузка","formula":"оплачиваемые часы ÷ доступные часы","why":"Выше 80% два месяца подряд — повод поднять цены."},{"name":"Доля повторных клиентов","formula":"заказы от тех, кто уже заказывал ÷ все заказы","why":"Показывает, насколько доход устойчив. Для сравнения: по итогам 2025 года на Kwork 46,37% заказов были повторными.","src":["kwork-2025"]},{"name":"Конверсия по шагам","formula":"ответы ÷ отклики; заказы ÷ разговоры","why":"Показывает, что улучшать: текст отклика (мало ответов) или разговор и КП (мало заказов). Сравнивай себя с собой месяц к месяцу."}]},"retention":{"title":"Удержание и повторные продажи","items":[{"title":"Сдавай с заботой","text":"Аккуратные файлы, понятные названия, короткая инструкция: какой файл куда. Шаблон, в котором клиент может сам поменять текст, — плюс к репутации."},{"title":"Напомни о себе через 2–4 недели","text":"Спроси, как работает результат, и предложи следующий шаг: «к распродаже можно обновить обложки»."},{"title":"Календарь поводов","text":"Запиши для постоянных клиентов их поводы: новые товары, сезон, праздники, акции. Пиши за 2–3 недели до них."},{"title":"Абонемент","text":"Тем, кто заказывает чаще раза в месяц, предложи абонемент: им удобнее, тебе — предсказуемый доход."},{"title":"Рекомендации","text":"Спрашивай конкретно: «Кому из знакомых предпринимателей может пригодиться такая работа?» — и предлагай бонус за рекомендацию."},{"title":"Кейс с цифрами","text":"Через месяц после запуска попроси данные: клики, заявки, продажи. Цифры делают кейс в разы сильнее — и для клиентов, и для найма."}]},"productivity":{"title":"Продуктивность","items":[{"title":"Шаблоны документов","text":"Бриф, КП, договор, счёт, сообщения — в одной папке. Каждый новый заказ начинается с копии, а не с чистого листа."},{"title":"Библиотека в Figma","text":"Свой стартовый файл для каждого типа задач: сетки, стили текста и цвета, компоненты, типовые слайды и блоки. Это экономит часы на каждом заказе."},{"title":"Свои подборки","text":"Проверенные шрифты с кириллицей, мокапы, фотостоки — только с понятной лицензией на коммерческое использование."},{"title":"ИИ-инструменты","text":"Подходят для черновиков текстов, фонов и сцен, вариантов, разбора брифа. По итогам 2025 года на Kwork 86% исполнителей используют ИИ, а логотипы и инфографика, сделанные с ИИ, продаются в 1,68 раза дешевле. Значит, ИИ — ускоритель, а не замена мышлению: продавай решение задачи, а не картинку.","src":["kwork-2025"]},{"title":"Оговорки про ИИ","text":"Проверь доступность сервиса из Беларуси: например, OpenAI официально не поддерживает Беларусь и Россию. Читай лицензию на коммерческое использование, не выдавай генерацию за ручную работу и предупреждай клиента, если используешь ИИ в его проекте.","src":["openai-countries"]},{"title":"Планирование загрузки","text":"Один крупный проект за раз. Если заказов больше, чем часов, ставь их в очередь с датой старта, а не обещай «завтра». Очередь — сигнал поднять цены."}],"week":[{"hours":4,"what":"Работа над заказами"},{"hours":2,"what":"Поиск клиентов: отклики, холодные сообщения, партнёры, контент"},{"hours":1,"what":"Учёба и насмотренность"}],"weekNote":"Ориентир для 2–3-й ступени. На 1-й ступени больше времени уходит на портфолио и поиск, а с ростом повторных клиентов поиск сокращается.","redFlags":["«Сначала сделайте, потом обсудим оплату» или «заплатим, если понравится».","Бесплатное «тестовое» на реальную задачу.","Отказ от брифа и ТЗ: «ну вы же дизайнер, сделайте красиво».","«Все предыдущие дизайнеры были ужасные».","Срочно, сложно и без бюджета одновременно.","Много людей согласуют, но никто не отвечает за решение.","Просьба заплатить за доступ к заказам или перейти по подозрительной ссылке.","Оплата через чужие карты, аккаунты или «серые» схемы."]},"risks":{"title":"Защита от рисков","items":[{"risk":"Неоплата","signs":"Клиент тянет с предоплатой, просит «сначала результат».","protect":"Предоплата 50% (мелкие заказы — 100%), этапы с оплатой, финальные файлы — после полной оплаты, чек в «Профдоходе»."},{"risk":"Бесконечные правки","signs":"«Давайте попробуем ещё вариант», меняется мнение, подключаются новые люди.","protect":"2 круга правок в цене, правки — одним списком, дальше — по часовой ставке. Это прописано в договоре или сообщении до старта."},{"risk":"Разрастание объёма","signs":"«Заодно сделайте ещё…», новые форматы и страницы.","protect":"ТЗ со списком «что не входит». Новая задача — новая смета: «С радостью сделаю, это +[сумма] и +[N] дней»."},{"risk":"Зависимость от одного клиента","signs":"Один клиент даёт больше половины дохода.","protect":"Продолжай поиск даже при полной загрузке: хотя бы 1 час в неделю."},{"risk":"Выгорание","signs":"Работа по ночам, раздражение, всё «срочно».","protect":"Лимит часов в неделю, один выходной без переписки, +20% к срокам, отказ от «красных флагов»."}]},"finance":{"title":"Финансы фрилансера","items":[{"title":"Финансовая подушка","text":"Накопи 3 месяца обязательных расходов, прежде чем делать фриланс основным доходом. Пока подушки нет — не бросай другой источник дохода."},{"title":"Налоги","text":"Откладывай 10% с каждой оплаты сразу, а в месяц — не меньше 45 BYN (минимальный НПД с 1 июля 2026). Уплата — до 22-го числа следующего месяца. Подробно — в разделе «Первые заказы» → «Как оформиться».","src":["npd-2026","npd-ilex"]},{"title":"Отдельная карта для работы","text":"Все оплаты от клиентов — на одну карту, личные траты — с другой. Так сразу видно доход, налог и расходы."},{"title":"«Зарплата» себе","text":"Раз в месяц переводи себе фиксированную сумму с рабочей карты. Остаток — в подушку и на налог. Доход фрилансера скачет, а траты должны быть ровными."},{"title":"Сезонность","text":"У каждой ниши свои пики и спады. Записывай доход по месяцам: через 6–12 месяцев ты увидишь свою сезонность. Тихие месяцы — время для портфолио, учёбы и аутрича."},{"title":"Курс рубля","text":"Клиентам из России называй цену в RUB по курсу на день счёта. Официальный курс — на сайте Нацбанка.","src":["nbrb-rates"]}]},"levels":{"title":"Ступени дохода","intro":"Это расчёт по формуле «оплачиваемые часы × ставка», а не обещание. Суммы — сколько заплатили клиенты за месяц, до налога. При 7 часах в неделю у тебя около 30 рабочих часов в месяц, из них оплачиваемых — примерно половина.","items":[{"id":"l1","title":"Первые заказы","range":"до 150 BYN в месяц","rate":"10–15 BYN в час","hours":"до 10 оплачиваемых часов","looks":"1–3 заказа в месяц, большая часть времени уходит на портфолио и поиск.","next":["Получить 3 отзыва и 3 коммерческих кейса.","Вести таблицу лидов и найти шаблон отклика, на который отвечают.","Получить первого повторного клиента.","Зарегистрироваться в «Профдоходе», когда заказы стали регулярными."],"note":"Минимальный налог 45 BYN в месяц — почти треть от 150 BYN. Поэтому регистрироваться в «Профдоходе» лучше перед первой оплатой, а не за месяцы до заказов."},{"id":"l2","title":"Регулярный поток","range":"150–400 BYN в месяц","rate":"15–25 BYN в час","hours":"10–16 оплачиваемых часов","looks":"Заказы каждый месяц, 1–2 постоянных клиента, понятно, какой канал работает.","next":["Выбрать нишу и переупаковать профиль и портфолио.","Сделать 3 пакета и предложить абонемент постоянным клиентам.","Поднять цены новым клиентам на 10–20%.","Найти 2–3 партнёров: студии, маркетологи, разработчики."]},{"id":"l3","title":"Стабильно на 7 часах","range":"400–750 BYN в месяц","rate":"25–40 BYN в час","hours":"16–18 оплачиваемых часов","looks":"Половина дохода и больше — от повторных клиентов и рекомендаций. Поиск занимает 1–2 часа в неделю.","next":["Это потолок для 7 часов в неделю. Дальше — решение: добавить часы или идти в найм.","Чтобы расти во фрилансе: увеличить время до 20–30 часов в неделю и держать ставку от 30 BYN.","Чтобы идти в найм: оформить 2–3 лучших кейса для работодателя (раздел «Переход в найм»)."]},{"id":"l4","title":"Уровень зарплаты","range":"1 500–3 000 BYN в месяц","rate":"30–40 BYN в час","hours":"50–80 оплачиваемых часов, то есть 20–30 рабочих часов в неделю","looks":"Фриланс — основная работа: ниша, пакеты, абонементы, партнёры, личный бренд.","next":["Держать долю повторных клиентов от 50% и не зависеть от одного клиента.","Переходить к ценностной модели в крупных проектах.","Подушка — 3 месяца расходов, налоги — по графику."]}],"compare":[{"label":"Медиана зарплаты графического дизайнера в Беларуси, опыт 1–3 года (вакансии rabota.by, n = 15, в основном «на руки»)","value":"1 800 BYN","src":"rabota-by"},{"label":"Средняя начисленная зарплата в Беларуси, август 2026 (до налогов, данные Белстата)","value":"3 135,9 BYN","src":"belstat-wage"},{"label":"Средний доход дизайнера-фрилансера на платформе Solar Staff в 2025 году (Россия)","value":"83,4 тыс. ₽ ≈ 3 000 BYN","src":"solarstaff-2025"}],"note":"4-я ступень требует в 3–4 раза больше времени, чем 7 часов в неделю. Если столько времени нет, реалистичная цель на фрилансе — 3-я ступень, а дальше рост — через найм."},"hiringLink":{"title":"Связь с наймом","items":[{"title":"Как фриланс усиливает","text":"Коммерческие кейсы с результатами, опыт брифов, сроков, правок и общения с клиентами — ровно то, о чём спрашивают на собеседованиях. В резюме это полноценный опыт работы: «Фриланс-дизайнер (НПД), 2026 — н. в.», с клиентами и результатами."},{"title":"Когда переходить","text":"Когда выполнены критерии готовности из раздела «Переход в найм». Или когда 3-я ступень достигнута, а хочется стабильности, команды и роста быстрее, чем позволяют 7 часов в неделю."},{"title":"Можно ли совмещать","text":"Можно. МНС разъясняет, что основное место работы не мешает платить НПД с доходов от других заказчиков. Но у деятельности на НПД не должно быть нанимателя: р
