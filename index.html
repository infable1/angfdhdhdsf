аботать на НПД на своего же работодателя нельзя. Проверь и трудовой договор: пункты о совместительстве, конфиденциальности и работе на конкурентов.","src":["npd-job","npd-substitution"]},{"title":"Как совмещать без перегруза","text":"После выхода на работу оставь 1–2 постоянных клиентов на абонементе и не бери срочные заказы. Новые проекты — только если они не конкурируют с работодателем и не мешают испытательному сроку."}]},"checklist":[{"id":"gw-1","text":"Таблица лидов, заказов и финансов ведётся каждую неделю"},{"id":"gw-2","text":"Посчитаны средний чек, доход в час и загрузка за прошлый месяц"},{"id":"gw-3","text":"Выбрана ниша и проверен спрос: заказы в чатах, 10 разговоров"},{"id":"gw-4","text":"Профиль и портфолио переупакованы под нишу"},{"id":"gw-5","text":"Есть 3 пакета услуг и абонемент"},{"id":"gw-6","text":"Есть шаблоны КП и договора-минимума"},{"id":"gw-7","text":"Каждый заказ — с предоплатой и лимитом правок"},{"id":"gw-8","text":"Есть хотя бы один кейс с цифрами"},{"id":"gw-9","text":"2–3 партнёра, которые передают заказы"},{"id":"gw-10","text":"Отдельная карта для рабочих денег, налог откладывается с каждой оплаты"},{"id":"gw-11","text":"Подушка — 1 месяц расходов, дальше — 3 месяца"},{"id":"gw-12","text":"Цены пересматриваются раз в 3–6 месяцев"},{"id":"gw-13","text":"Доля повторных клиентов 30% и выше"},{"id":"gw-14","text":"Через 6 месяцев принято решение: больше часов на фриланс или подготовка к найму"}],"plan":[{"month":1,"title":"Система","tasks":["Завести таблицу лидов, заказов и финансов","Собрать шаблоны КП и договора-минимума","Попросить отзыв у каждого клиента","Отправлять 10 холодных сообщений в неделю","Зарегистрироваться в «Профдоходе», если ещё нет"],"target":"Таблица заполнена, 40 контактов за месяц"},{"month":2,"title":"Ниша","tasks":["Разобрать свои заказы: какие проще, прибыльнее, интереснее","Выбрать нишу по трём фильтрам и 2 недели считать заказы в ней","Поговорить с 10 представителями ниши","Сделать 1–2 работы для портфолио под нишу"],"target":"Ниша выбрана и проверена"},{"month":3,"title":"Пакеты и абонемент","tasks":["Описать 3 пакета и абонемент, посчитать цены в калькуляторе","Переупаковать профиль, био и портфолио под нишу","Предложить абонемент 2–3 постоянным клиентам","Попросить цифры для первого кейса"],"target":"Пакеты опубликованы, 1 абонемент"},{"month":4,"title":"Партнёры и цены","tasks":["Написать 10 потенциальным партнёрам: студии, маркетологи, разработчики","Опубликовать 2 кейса: Behance или Telegram-канал","Если загрузка выше 80% — поднять цены новым клиентам на 10–20%"],"target":"2 партнёра, новая цена для новых клиентов"},{"month":5,"title":"Повторные клиенты","tasks":["Напомнить о себе всем бывшим клиентам с идеей следующего шага","Ввести бонус за рекомендацию","Составить календарь поводов постоянных клиентов"],"target":"Повторные клиенты дают 30–50% дохода"},{"month":6,"title":"Итоги и решение","tasks":["Посчитать метрики за полгода: доход, доход в час, каналы, повторные клиенты","Убрать каналы, которые не приносят заказов","Решить: больше часов на фриланс или подготовка к найму (критерии — в разделе «Переход в найм»)"],"target":"Решение принято, план на следующие 3 месяца"}],"planNote":"План рассчитан на 7 часов в неделю. Если месяц выпал — продолжай с того же пункта. Ступени не обязаны совпадать с месяцами.","templates":[{"id":"t-offer","title":"Коммерческое предложение","lines":["Коммерческое предложение: [услуга] для [компания]","","Задача","[1–2 предложения: что нужно клиенту и зачем — его словами из брифа]","","Что вы получите","— [результат 1]","— [результат 2]","— [результат 3]","","Как будем работать","1. Бриф и согласование ТЗ — [дата]","2. [Этап] — [срок]","3. [Этап] — [срок]","4. Сдача файлов — [дата]","","Варианты","Базовый: [что входит] — [сумма] BYN","Стандарт: [что входит] — [сумма] BYN (рекомендую)","Премиум: [что входит] — [сумма] BYN","","Условия: предоплата 50%, 2 круга правок на каждом этапе, дополнительные правки — [ставка] BYN в час. Исходники — [входят / за доплату].","Похожие работы: [ссылка 1], [ссылка 2]","Предложение действует до [дата].","","Аня, [роль] · [контакт]"],"note":"Отправляй после брифа или разговора, а не вместо них. Одна страница — достаточно."},{"id":"t-packages","title":"Описание пакетов услуг","lines":["[Услуга] — 3 варианта","","БАЗОВЫЙ — [сумма] BYN, [N] дней","Для кого: [кому подходит]","Входит: [пункт 1], [пункт 2], [пункт 3]","","СТАНДАРТ — [сумма] BYN, [N] дней","Для кого: [кому подходит]","Входит: всё из «Базового» + [пункт 4], [пункт 5]","","ПРЕМИУМ — [сумма] BYN, [N] дней","Для кого: [кому подходит]","Входит: всё из «Стандарта» + [пункт 6], [приоритетные сроки]","","Во всех пакетах: бриф, 2 круга правок, файлы для [площадка / печать / экран].","Не входит: [тексты / фото / печать / исходники] — можно добавить отдельно.","","Абонемент: [объём] в месяц — [сумма] BYN, оплата в начале месяца."],"note":"Пиши, для кого каждый пакет: клиенту проще узнать себя, чем сравнивать списки."},{"id":"t-contract","title":"Договор-минимум: обязательные пункты","lines":["1. Стороны: имя или название, контакты, реквизиты для оплаты.","2. Предмет: что именно делается — услуга, форматы, количество, размеры.","3. Что не входит в работу: тексты, фото, печать, публикация и т. п.","4. Сроки по этапам и что сдвигает срок (задержка материалов или ответов клиента).","5. Стоимость, порядок и сроки оплаты: предоплата, этапы, валюта (с белорусскими клиентами — BYN).","6. Правки: сколько кругов входит, что считается правкой, цена дополнительных правок.","7. Приёмка: срок на проверку и что будет, если клиент не ответил в этот срок.","8. Передача файлов: финальные файлы — после полной оплаты; входят ли исходники.","9. Права на результат: что клиент может делать с дизайном; право показывать работу в портфолио.","10. Отмена: что оплачивается, если клиент отказался в процессе (выполненные этапы).","11. Конфиденциальность: какие данные клиента нельзя раскрывать.","12. Чек: оплата подтверждается чеком из приложения «Профдоход»."],"note":"Это не юридическая консультация. Для небольших заказов эти пункты можно согласовать в переписке до старта; для крупных проектов лучше подписанный договор — при сомнениях покажи его юристу."},{"id":"t-raise","title":"Сообщение о повышении цен","lines":["[Имя], здравствуйте!","","Спасибо, что работаем вместе уже [срок], — мне очень ценно наше сотрудничество.","","С [дата через 30 дней] стоимость моих услуг меняется: [услуга] — [новая цена] BYN вместо [старая цена] BYN. Это связано с [ростом спроса / новыми навыками / тем, что теперь в работу входит ещё и …].","","Все заказы, которые оформим до [дата], — по текущей цене.","","Если у вас есть планы на ближайшие месяцы, давайте обсудим: могу закрепить для вас пакет [пакет] по нынешней цене на [срок]."],"note":"Предупреждай за 30 дней, пиши лично каждому постоянному клиенту, без извинений."},{"id":"t-table","title":"Таблица учёта клиентов и финансов","lines":["Лист «Лиды»: дата | источник | клиент | контакт | ниша | задача | статус | сумма | следующий шаг | дата шага","Статусы: новый → есть ответ → разговор → КП → предоплата → в работе → сдано → оплачено / отказ (причина)","","Лист «Заказы»: № | клиент | задача | пакет | сумма BYN | валюта и курс | предоплата | дата оплаты | часы план | часы факт | повторный клиент (да/нет) | чек «Профдоход» (да/нет)","","Лист «Финансы»: месяц | доход | налог (10%, не меньше 45 BYN) | рабочие расходы | «зарплата» себе | в подушку","","Лист «Итоги месяца»: доход | число заказов | средний чек | все рабочие часы | доход в час | загрузка % | доля повторных % | отклики → ответы → разговоры → заказы"],"note":"Хватит Google Таблиц или Excel. Заполняй 15 минут раз в неделю, итоги — в первый день месяца."}]},"hiring":{"intro":"Фриланс даёт то, чего нет у выпускников курсов: коммерческие проекты, клиентов и результаты. Задача этого раздела — превратить этот опыт в оффер на позицию junior.","market":{"text":"На 14.10.2026 в вакансиях со словом «дизайнер» или designer в названии: в России — 2 802, из них без опыта — 326; в Беларуси — 169, без опыта — 19. Nielsen Norman Group в обзоре State of UX 2026 пишет, что junior-позиций по-прежнему мало, а конкуренция за них высокая; ценятся широта навыков, исследования и умение работать с ИИ, а сам по себе UI постепенно перестаёт быть преимуществом. Вывод: в найм лучше идти с коммерческим опытом, а не сразу после курсов.","sources":["hh-ru","rabota-by","nng-2026"]},"readiness":{"title":"Когда переходить: критерии готовности","criteria":[{"title":"3–5 коммерческих кейсов","text":"Оплаченные проекты для реальных клиентов в выбранном направлении. Хотя бы один — с цифрами или отзывом клиента."},{"title":"6–12 месяцев фриланса","text":"Регулярные заказы, повторные клиенты, опыт брифов, сроков и правок. Обычно это 2–3-я ступень дохода."},{"title":"Подтверждённая Figma","text":"Auto layout, компоненты и варианты, стили, аккуратная структура файла — это видно в любом тестовом."},{"title":"1 кейс с процессом или исследованием","text":"Анализ конкурентов, интервью, тест, варианты и обоснование выбора. Для UX/UI — обязательно."},{"title":"Передача в работу","text":"Хотя бы один проект, сданный в разработку, в печать или на площадку: макеты, спецификации, экспорт, ответы на вопросы."},{"title":"Английский для чтения","text":"Документация, статьи, интерфейсы инструментов. Для части белорусских UX-вакансий нужен уровень Intermediate и выше — проверяй в описании."},{"title":"Рассказ о кейсе","text":"Получается рассказать лучший проект за 5–7 минут: задача, решения, результат, выводы."}],"note":"Не нужно ждать выполнения всех пунктов: 5–6 из 7 — уже повод откликаться."},"requirements":{"title":"Что пишут в вакансиях","text":"Мы прочитали 58 вакансий без опыта и с опытом 1–3 года (43 — hh.ru, 15 — rabota.by, 14.10.2026) и посчитали, сколько раз в описаниях упоминаются инструменты и требования.","top":[{"name":"Photoshop","count":32},{"name":"Figma","count":30},{"name":"Illustrator","count":29},{"name":"Портфолио","count":27},{"name":"Нейросети и ИИ","count":15},{"name":"Удалённый формат","count":15},{"name":"Работа в команде","count":14},{"name":"CorelDRAW","count":10},{"name":"Английский","count":7},{"name":"After Effects","count":6},{"name":"Тестовое задание","count":5},{"name":"InDesign","count":5}],"note":"Портфолио просят почти всегда, даже если в описании о нём не сказано. В белорусских вакансиях чаще встречаются CorelDRAW и InDesign — полезно знать хотя бы базово.","sources":["hh-ru","rabota-by"]},"portfolio":{"title":"Портфолио для найма: чем отличается от портфолио для клиентов","rows":[{"aspect":"Что хотят увидеть","clients":"«Сделает мне так же»: похожие работы и результат","hiring":"Как ты думаешь и работаешь: процесс, решения, командная работа"},{"aspect":"Кейс","clients":"Задача и крупные картинки результата","hiring":"Контекст, ограничения, твоя роль, исследование, варианты, обоснование, результат, выводы"},{"aspect":"Доказательства","clients":"Отзывы и узнаваемые клиенты","hiring":"Цифры и изменения: что стало лучше после запуска"},{"aspect":"Количество","clients":"Много похожих работ в нише","hiring":"3–4 лучших кейса, один подробный, задачи разного типа в рамках направления"},{"aspect":"Команда","clients":"Обычно не важна","hiring":"Кто ещё был в проекте (маркетолог, разработчик, копирайтер) и как вы договаривались"},{"aspect":"Ошибки","clients":"Не показывают","hiring":"Что бы сейчас сделать иначе — это показывает рост"},{"aspect":"Формат","clients":"Behance, PDF, Telegram-канал","hiring":"Сайт-портфолио или PDF на 10–15 страниц + ссылки на подробные кейсы"}],"convert":["Выбери 3–4 лучших коммерческих проекта, разных по задачам.","Восстанови процесс: эскизы, версии, переписку — и убери из неё личные данные.","Добавь контекст: цель бизнеса, ограничения (сроки, бюджет, требования площадки), твоя роль.","Добавь результат: цифры от клиента, отзыв или что изменилось после запуска.","Добавь выводы: что сработало, что бы сейчас сделать иначе.","Проверь договорённости: можно ли показывать проект. Если нельзя — покажи процесс без названия клиента.","Один кейс сделай подробным (8–12 экранов), остальные — короче."]},"resume":{"title":"Резюме и сопроводительное письмо","rules":["Одна страница, PDF, понятное имя файла: «Anya_designer_CV.pdf».","Название должности — как в вакансии: «Графический дизайнер», «UI/UX-дизайнер (junior)».","Ссылка на портфолио — в первой строке, а не в конце.","Пункты опыта — через результаты, а не через обязанности.","Под каждую вакансию меняй порядок пунктов и ключевые слова.","Пиши в безличной форме: «Разработка серий карточек…», «Редизайн сценария записи…» — так принято в резюме."],"freelance":["Позиция: «Фриланс-дизайнер (НПД)» с датами — это полноценный опыт работы, а статус НПД подтверждает, что работа легальная.","Клиенты: сколько и какие, например «12 клиентов: 5 продавцов на Wildberries, 3 кофейни, 2 онлайн-школы». Названия — только с разрешения.","Результаты: «серия карточек для 5 продавцов WB, у одного клиента CTR обложки вырос с [X]% до [Y]%», «8 повторных клиентов».","Процессы: брифы, ТЗ, сроки, работа с правками, передача в печать или разработку — всё это нужно в команде.","Не прячь фриланс за «самообразованием»: коммерческий опыт — главный аргумент."],"coverTips":["5–7 предложений, не больше.","Первая фраза — почему именно эта компания и эта вакансия.","Дальше — 1–2 кейса, которые ближе всего к их задачам, со ссылками.","Закончи конкретным предложением: созвониться, показать кейс, сделать тестовое.","Не пересказывай резюме и не пиши «я начинающий дизайнер»."]},"where":{"title":"Где искать вакансии и стажировки","items":[{"title":"Беларусь","text":"rabota.by и praca.by — основные сайты вакансий; jobs.devby.io — ИТ-компании, в том числе вакансии дизайнеров.","resources":["j-rabota","j-praca","j-devby"]},{"title":"Россия и удалённая работа","text":"hh.ru с фильтром «Удалённо» и Хабр Карьера — особенно для UI/UX и продуктового дизайна. До отклика уточни, можно ли работать из Беларуси и как будет оформлена работа.","resources":["j-hh","j-habr"]},{"title":"LinkedIn","text":"Для международных компаний и рекрутеров. Нужен профиль на английском и портфолио по ссылке.","resources":["j-linkedin"]},{"title":"Telegram-каналы с вакансиями","text":"Design Hunters, «Вакансии для дизайнеров», ИЩУ_ДИЗАЙНЕРА, Джобстер Digital, DigitalHR. Новые вакансии появляются каждый день; откликайся быстро.","resources":["tg-designhunters","tg-designwork","tg-designer-ru","tg-digital-jobster","tg-digital-hr"]},{"title":"Студии и агентства напрямую","text":"Составь список из 20–30 студий в своём направлении (Behance, рейтинги, сайты) и напиши тем, чьи работы нравятся, даже если вакансии нет. Студии, с которыми был субподряд, — первые в списке."},{"title":"Стажировки и junior","text":"Ищи по словам «стажёр», «junior», «младший дизайнер», «без опыта» и ставь фильтр «Без опыта». Оплачиваемые стажировки встречаются в основном в UI/UX."},{"title":"Нетворкинг и рекомендации","text":"Скажи клиентам, партнёрам и знакомым дизайнерам, что ищешь работу и какую. Рекомендация от человека из компании часто весит больше, чем отклик."}]},"tests":{"title":"Тестовые задания","how":["Прочитай задание дважды и задай 1–2 уточняющих вопроса: цель, аудитория, критерии оценки, срок.","Ограничь время: 4–8 часов работы — разумный максимум. Если задание явно больше, уточни, какую часть сделать.","Покажи не только результат, но и ход мысли: 1–2 слайда с задачей, вариантами и аргументами.","Оформи аккуратно: понятная структура файла Figma, названия слоёв, экспорт.","Сдай в срок, а при задержке предупреди заранее.","Попроси обратную связь при любом исходе — это бесплатный разбор от практиков."],"redFlags":["Задание — реальная текущая задача компании или её клиента: «сделайте баннеры для нашей акции».","Огромный объём: полная айдентика, сайт целиком, 20 карточек.","Нет описания компании и вакансии, нет обратной связи после сдачи.","«Бесплатная пробная неделя» или «стажировка без оплаты на месяц, а дальше посмотрим».","Требуют исходники и права на использование тестового.","Просят оплатить обучение, материалы или «оформление»."],"redFlagsNote":"В таких случаях предложи показать похожий кейс из портфолио или сделать небольшую часть. Если компания настаивает на бесплатной работе, это говорит о том, как там будут относиться к твоему времени."},"interview":{"title":"Собеседования","stages":[{"title":"Скрининг с рекрутером","text":"15–30 минут: мотивация, формат работы, зарплатные ожидания, сроки выхода."},{"title":"Тестовое задание","text":"Не везде, но часто. Иногда идёт после интервью с дизайнером."},{"title":"Интервью с дизайнером или арт-директором","text":"Разбор портфолио и одного кейса, вопросы о процессе и решениях."},{"title":"Дизайн-челлендж","text":"В основном в UI/UX: 30–60 минут решаешь задачу вслух вместе с интервьюером."},{"title":"Финал","text":"Встреча с руководителем или командой: как ты впишешься, ожидания на испытательный срок."},{"title":"Оффер","text":"Зарплата, задачи, испытательный срок, дата выхода. Попроси оффер письменно."}],"questions":[{"q":"Расскажите о себе","tip":"60–90 секунд: кто ты как дизайнер, какой опыт, почему эта компания. Без биографии с детства."},{"q":"Покажите лучший кейс","tip":"По шаблону «Рассказ о кейсе»: задача → роль → процесс → решение → результат → выводы."},{"q":"Почему из фриланса — в найм?","tip":"Через то, к чему идёшь: команда, сложные продукты, наставник, рост. Не «фриланс не получился»."},{"q":"Как вы принимаете дизайн-решения?","tip":"Цель и аудитория → анализ → варианты → критерии выбора → проверка."},{"q":"Как вы работаете с правками и критикой?","tip":"Пример из фриланса: как уточняешь, что не нравится, как аргументируешь и где уступаешь."},{"q":"Был ли сложный клиент или конфликт?","tip":"Короткая история: ситуация, что сделано, чем закончилось, что теперь делаешь иначе."},{"q":"Как используете ИИ в работе?","tip":"Конкретно: какие задачи ускоряешь и как проверяешь результат."},{"q":"Какие у вас зарплатные ожидания?","tip":"Вилка на основе данных, «на руки» или «до вычета» — см. ниже."}],"challenge":["Думай вслух: интервьюеру важен ход мысли, а не идеальная картинка.","Начни с вопросов: кто пользователь, какая цель, какие ограничения.","Сначала структура и сценарий, потом детали.","Следи за временем и оставь 5 минут на итог: решение и почему оно такое."],"askEmployer":["Кто будет наставником и как устроено ревью дизайна?","Какие задачи будут в первые 3 месяца и что считается успешным испытательным сроком?","Как дизайнеры работают с разработкой, маркетингом и менеджерами?","Как часто дают обратную связь?","Зарплата в оффере — «на руки» или до вычета налогов? Как оформляется работа?","Есть ли бюджет на обучение и лицензии на программы?"]},"salary":{"title":"Зарплатные ожидания и разговор о деньгах","intro":"Ниже — медианы и примеры зарплат из вакансий на 14.10.2026 по каждому направлению: без опыта и с опытом 1–3 года. Где вакансий мало, так и написано.","netGross":{"text":"В Беларуси зарплату в вакансиях указывают то «на руки», то до вычета налогов — уточняй всегда. С зарплаты удерживаются подоходный налог 13% и 1% в ФСЗН, то есть «на руки» получается около 86% суммы до вычета (без учёта льгот и вычетов). Пример: 2 000 BYN до вычета ≈ 1 720 BYN на руки.","sources":["income-tax-2026","fszn-1"]},"talk":["Перед разговором посмотри свою строку в таблице и 10–15 свежих вакансий своего уровня.","Называй вилку, а не одно число. Нижняя граница — сумма, ниже которой не согласишься.","Уточняй, «на руки» это или до вычета, и в какой валюте.","Сравнивай не только деньги: наставник, задачи, график, обучение, испытательный срок.","Фриланс-доход — аргумент: «сейчас на фрилансе я зарабатываю X при неполной загрузке».","Если вилка компании ниже — спроси, когда и по каким критериям пересматривают зарплату."]},"combine":{"title":"Как совмещать фриланс и поиск работы","items":[{"title":"Перераспредели 7 часов","text":"Примерно 3 часа — постоянные клиенты, 3 часа — отклики и тестовые, 1 час — подготовка к интервью. Новых клиентов в это время лучше не искать."},{"title":"Не больше 1–2 тестовых одновременно","text":"Тестовые съедают время быстрее всего. Выбирай вакансии, которые действительно интересны."},{"title":"Сохрани доход","text":"Постоянных клиентов на абонементе не бросай до оффера. Это подушка и аргумент на собеседовании."},{"title":"Когда пришёл оффер","text":"Предупреди клиентов за 2–4 недели, закрой обязательства и порекомендуй коллегу на своё место. Это сохраняет репутацию и рекомендации."},{"title":"НПД и работа по найму","text":"МНС разъясняет: основное место работы не мешает платить НПД с доходов от других заказчиков. Но работать на НПД на своего же работодателя нельзя — это подмена трудовых отношений. Проверь и трудовой договор: пункты о совместительстве и работе на конкурентов.","src":["npd-job","npd-substitution"]}]},"checklist":[{"id":"hr-1","text":"Выполнено 5–6 из 7 критериев готовности"},{"id":"hr-2","text":"3–4 кейса переписаны для найма: процесс, решения, результат, выводы"},{"id":"hr-3","text":"Портфолио — сайт или PDF на 10–15 страниц — открывается с телефона"},{"id":"hr-4","text":"Резюме на 1 страницу в PDF, фриланс оформлен как опыт работы"},{"id":"hr-5","text":"Готово базовое сопроводительное письмо"},{"id":"hr-6","text":"Профили на rabota.by, hh.ru и Хабр Карьере (LinkedIn — по желанию)"},{"id":"hr-7","text":"Подписка на 3–5 Telegram-каналов с вакансиями"},{"id":"hr-8","text":"Рассказ о кейсе отрепетирован вслух за 5–7 минут"},{"id":"hr-9","text":"Подготовлены ответы на 8 типовых вопросов"},{"id":"hr-10","text":"Известна своя зарплатная вилка — «на руки» и до вычета"},{"id":"hr-11","text":"Таблица откликов: компания, дата, этап, ответ"},{"id":"hr-12","text":"Понятно, как совмещать поиск с текущими клиентами"}],"plan":[{"week":1,"title":"Кейсы","tasks":["Выбрать 3–4 лучших проекта","Переписать один кейс подробно: контекст, процесс, решения, результат, выводы","Обновить портфолио"],"target":"1 подробный кейс готов"},{"week":2,"title":"Резюме и профили","tasks":["Сделать резюме по шаблону","Заполнить профили на rabota.by, hh.ru, Хабр Карьере","Написать базовое сопроводительное","Составить список из 30 компаний и студий"],"target":"Резюме и профили опубликованы"},{"week":3,"title":"Первые отклики","tasks":["10–15 откликов с адаптированным письмом","5 сообщений дизайнерам или рекрутерам","Подписаться на каналы с вакансиями","Завести таблицу откликов"],"target":"15–20 откликов и сообщений"},{"week":4,"title":"Подготовка к интервью","tasks":["10–15 откликов","Отрепетировать рассказ о кейсе вслух и записать на телефон","Подготовить ответы на типовые вопросы и вопросы работодателю"],"target":"Рассказ о кейсе — 5–7 минут"},{"week":5,"title":"Интервью и тестовые","tasks":["10 откликов","1–2 тестовых, не больше","После каждого интервью — записать вопросы и что улучшить"],"target":"Первые интервью"},{"week":6,"title":"Разбор","tasks":["Посчитать: отклики → приглашения → интервью","Если после 30–40 откликов нет приглашений — показать резюме и портфолио 2–3 дизайнерам и поправить","Доработать кейс по вопросам с интервью"],"target":"Резюме и портфолио улучшены"},{"week":7,"title":"Нетворкинг","tasks":["Попросить рекомендации у клиентов и партнёров","Написать напрямую в 10 студий","10 откликов"],"target":"10 прямых контактов"},{"week":8,"title":"Офферы и решение","tasks":["Сравнить офферы: деньги «на руки», задачи, наставник, рост","Договориться о дате выхода","Предупредить клиентов и закрыть обязательства"],"target":"Оффер или план следующего цикла"}],"planNote":"Поиск junior-позиции может занять больше 8 недель: позиций мало, а конкуренция высокая. Это не провал. Повторяй недели 3–7 и улучшай то, что показывает таблица откликов.","planNoteSrc":["nng-2026"],"templates":[{"id":"t-resume","title":"Структура резюме","lines":["Аня [Фамилия]","[Должность из вакансии, например: Графический дизайнер] · [город], [офис / удалённо / гибрид]","Портфолио: [ссылка] · Telegram: [@ник] · Email: [почта]","","О себе","[2–3 строки: направление, сколько коммерческого опыта, в чём сильные стороны, какие задачи интересны]","","Опыт","Фриланс-дизайнер (НПД) — [месяц, год] — настоящее время","— [N] клиентов: [типы клиентов]","— [Задача] для [клиент]: [результат с цифрой]","— [Задача] для [клиент]: [результат]","— [N] повторных клиентов, работа по брифу и ТЗ, передача в [печать / разработку / на площадку]","","[Предыдущая работа, если есть: должность, компания, даты, 1–2 пункта, полезных для дизайна]","","Навыки и инструменты","[Figma: auto layout, компоненты, прототипы] · [Photoshop / Photopea] · [Illustrator] · [Tilda] · [ИИ-инструменты: для чего]","","Обучение","[Курс, организация, год] · [Курс, организация, год]","","Языки","Русский; английский — [уровень, например: чтение профессиональных текстов]; [другие языки, если есть]"],"note":"Одна страница. Под каждую вакансию меняй строку «О себе» и порядок пунктов опыта."},{"id":"t-cover","title":"Сопроводительное письмо","lines":["Здравствуйте, [имя]!","","Откликаюсь на вакансию [должность] в [компания]. Мне близко [что именно в продукте, клиентах или работах компании — конкретно].","","Последние [N] месяцев работаю фриланс-дизайнером: [N] коммерческих проектов, из них [число] — [похожие на ваши задачи]. Например, [кейс]: [задача → результат]. Подробно: [ссылка на кейс].","","В команде хочу [расти в … / работать над … / учиться у …].","","Портфолио: [ссылка]. С удовольствием расскажу о кейсах на созвоне или сделаю тестовое задание.","","Аня [Фамилия], [телефон или Telegram]"],"note":"5–7 предложений. Первая строка — про компанию, не про тебя."},{"id":"t-recruiter","title":"Сообщение рекрутеру или дизайнеру","lines":["Здравствуйте, [имя]! Меня зовут Аня, я [направление]-дизайнер.","","Пишу по вашему посту о [вакансия / проект].","","У меня [N] месяцев коммерческого опыта на фрилансе: [типы задач]. Самый близкий к вашим задачам кейс — [ссылка].","","Подскажите, пожалуйста, актуальна ли вакансия и кому лучше отправить резюме? Если сейчас позиций нет — можно ли написать вам через пару месяцев?","","Спасибо!"],"note":"Коротко и с одной ссылкой. Не отправляй одно и то же сообщение всем подряд."},{"id":"t-case-story","title":"Рассказ о кейсе на собеседовании","lines":["1. Контекст (30 сек): кто клиент, какой бизнес, в какой ситуации пришёл.","2. Задача (30 сек): что нужно было сделать и зачем — цель бизнеса и ограничения (сроки, бюджет, требования площадки).","3. Моя роль (15 сек): что делаю я, кто ещё был в проекте.","4. Процесс (2 мин): анализ, референсы, варианты — и как выбирается решение. 2–3 ключевых развилки: «было два пути, выбран этот, потому что…».","5. Решение (1 мин): итоговые макеты и 3 главных аргумента.","6. Результат (30 сек): цифры, отзыв или что изменилось после запуска.","7. Выводы (30 сек): что сработало и что сейчас сделать иначе.","","Итого 5–7 минут. Дальше — вопросы интервьюера."],"note":"Отрепетируй вслух и запиши на телефон: так сразу слышно, где затянуто."}]},"quiz":{"title":"Какое направление тебе подходит","intro":"7 вопросов, около 2 минут. Тест не ставит диагноз, а помогает выбрать, с чего начать. Он учитывает, что тебе нравится, как быстро нужны деньги и к чему хочется прийти: к своему фрилансу или к работе в команде.","method":"Каждый ответ добавляет баллы направлениям. Ответы про сроки и цели добавляют ещё и оценки направлений: «лёгкость первых заказов», «потолок дохода» или «перспективы найма» (шкала 1–5 на страницах направлений).","priorityWeight":0.5,"questions":[{"id":"q1","text":"Что из этого хочется делать больше всего?","options":[{"text":"Делать товары заметными и продающими на маркетплейсах","w":{"marketplace":4,"graphic":1}},{"text":"Собирать посты, баннеры и презентации","w":{"graphic":4,"marketplace":1,"branding":1}},{"text":"Придумывать образ компании: логотип, стиль, характер","w":{"branding":4,"graphic":1}},{"text":"Делать сайты, которые понятны и приводят заявки","w":{"web":4,"uxui":1}},{"text":"Разбираться, как людям удобнее пользоваться приложением или сервисом","w":{"uxui":4,"web":1}},{"text":"Оживлять картинки: анимация и видео","w":{"motion":4}}]},{"id":"q2","text":"Когда нужны первые деньги с дизайна?","options":[{"text":"Как можно раньше — через 2–4 месяца","w":{"marketplace":3,"graphic":2},"p":"entry"},{"text":"Могу подождать полгода, если потом заработок будет выше","w":{"web":2,"branding":2,"graphic":1},"p":"ceiling"},{"text":"Не спешу: важнее крепкая база и потом работа в команде","w":{"uxui":2,"motion":1,"graphic":1},"p":"hiring"}]},{"id":"q3","text":"Что хочется в итоге через 1–2 года?","options":[{"text":"Свой фриланс: свои клиенты и свой график","w":{"branding":2,"web":2,"marketplace":1,"motion":1},"p":"ceiling"},{"text":"Работу в команде: зарплата, наставник, большие продукты","w":{"uxui":2,"graphic":2,"motion":1},"p":"hiring"},{"text":"Пока не знаю — хочется попробовать и то и другое","w":{"graphic":2,"web":2,"uxui":1}}]},{"id":"q4","text":"Как насчёт общения с клиентами?","options":[{"text":"Нормально: созвоны, переписка, объяснять свои решения","w":{"branding":2,"web":2,"uxui":1}},{"text":"Лучше короткие понятные задачи и переписка","w":{"marketplace":2,"graphic":2,"motion":1}},{"text":"Нравится расспрашивать людей и слушать, как они думают","w":{"uxui":2,"branding":1}}]},{"id":"q5","text":"Что тебе ближе всего?","options":[{"text":"Логика и структура: схемы, сценарии, порядок","w":{"uxui":3,"web":2}},{"text":"Эстетика: шрифты, цвета, детали","w":{"branding":3,"graphic":2}},{"text":"Динамика: движение, ритм, монтаж","w":{"motion":3}},{"text":"Маркетинг: что цепляет и продаёт","w":{"marketplace":3,"graphic":1,"web":1}}]},{"id":"q6","text":"Какие задачи приятнее?","options":[{"text":"Короткие: сделать за вечер-два и сразу увидеть результат","w":{"marketplace":2,"graphic":2,"motion":1}},{"text":"Длинные проекты, в которые можно глубоко погрузиться","w":{"uxui":2,"branding":2,"web":2}}]},{"id":"q7","text":"Какой у тебя компьютер?","options":[{"text":"Обычный ноутбук или старый компьютер","w":{"motion":-2}},{"text":"Мощный: без проблем тянет видеомонтаж и 3D","w":{"motion":2}},{"text":"Не знаю","w":{}}]}],"fit":{"marketplace":"Самый быстрый путь к первым деньгам: продавцам постоянно нужны карточки, а задачи короткие и понятные. Учти, что потолок дохода низкий, если не расти дальше — в бренд-дизайн или графику.","graphic":"Баланс скорости и перспектив: заказов много, а в найме это самое частое название вакансии и в России, и в Беларуси. Хорошая база для любого следующего шага.","branding":"Для тех, кто любит стиль и детали. Первые заказы даются тяжелее, но с нишей и сильными кейсами чек заметно растёт.","web":"Сайты под ключ легко объяснить малому бизнесу, а чек выше, чем в графике. Учиться дольше: дизайн плюс сборка на Tilda или Framer. Хорошая ступенька к UX/UI.","uxui":"Самый длинный путь, зато лучшие перспективы найма и дохода. На фрилансе удобно начинать с UX-аудитов и веб-дизайна.","motion":"Интересно и платят выше графики, но нужен производительный компьютер и больше времени на обучение. Начать можно на бесплатных инструментах."},"resultTitle":"Тебе больше всего подходят","resultNote":"Это подсказка, а не приговор. Открой страницы обоих направлений: что делает специалист, сколько платят, как выглядит роадмап. Для старта выбери одно — ко второму можно вернуться позже.","computerNote":"Для моушн-дизайна нужен производительный компьютер. Если его нет, начни с графики, а моушн добавь позже."},"calculator":{"title":"Калькулятор ставки","intro":"Введи, сколько хочешь получать «на руки» и сколько часов есть в неделю. Калькулятор покажет минимальную ставку в час и минимальную цену типовых задач.","weeksPerMonth":4.33,"fields":[{"id":"desired","label":"Желаемый доход «на руки», BYN в месяц","default":300,"min":0,"max":20000,"step":10},{"id":"hoursWeek","label":"Рабочих часов в неделю","default":7,"min":1,"max":60,"step":1},{"id":"share","label":"Доля оплачиваемых часов, %","default":50,"min":10,"max":90,"step":5,"hint":"Остальное время — поиск клиентов, переписка, учёба"},{"id":"expenses","label":"Рабочие расходы, BYN в месяц","default":30,"min":0,"max":5000,"step":5,"hint":"Подписки, интернет, шрифты, реклама, техника"},{"id":"tax","label":"Налог, %","default":10,"min":0,"max":50,"step":1,"hint":"НПД — 10% с доходов от физлиц и иностранных клиентов"},{"id":"minTax","label":"Минимальный налог, BYN в месяц","default":45,"min":0,"max":500,"step":1,"hint":"Минимальный НПД с 1 июля 2026"},{"id":"reserve","label":"Запас на правки и общение, %","default":20,"min":0,"max":100,"step":5}],"formula":["Оплачиваемые часы = часы в неделю × 4,33 × доля оплачиваемых часов","Выручка = большее из двух: (доход + расходы + минимальный налог) и (доход + расходы) ÷ (1 − налог)","Минимальная ставка = выручка ÷ оплачиваемые часы","Цена задачи = ставка × часы на задачу × (1 + запас)"],"tasks":[{"direction":"marketplace","title":"Слайд инфографики","hours":2},{"direction":"marketplace","title":"Серия из 7 слайдов","hours":14},{"direction":"marketplace","title":"Рич-контент Ozon","hours":10},{"direction":"graphic","title":"Шаблон поста для соцсетей","hours":1.5},{"direction":"graphic","title":"Баннер в 3 форматах","hours":3},{"direction":"graphic","title":"Презентация на 10 слайдов","hours":12},{"direction":"graphic","title":"Листовка","hours":6},{"direction":"branding","title":"Логотип: 3 концепции и доработка","hours":20},{"direction":"branding","title":"Мини-айдентика","hours":45},{"direction":"web","title":"Лендинг: дизайн в Figma","hours":20},{"direction":"web","title":"Лендинг под ключ на Tilda","hours":35},{"direction":"uxui","title":"UX-аудит одного сценария","hours":10},{"direction":"uxui","title":"Дизайн 5 экранов приложения","hours":30},{"direction":"motion","title":"Анимация логотипа 5–7 с","hours":8},{"direction":"motion","title":"Ролик 15–30 с для соцсетей","hours":16}],"tasksNote":"Часы на задачу — наше допущение для новичка, а не рыночная статистика. С опытом и шаблонами задачи занимают меньше времени — тогда при той же цене растёт доход в час.","resultNote":"Если цена выше, чем в таблице ориентиров раздела «Первые заказы», это нормально для 7 часов в неделю. На первые 3–5 заказов цену можно поставить ниже расчёта ради отзывов. Дальше рост идёт через три рычага: меньше часов на задачу, больше оплачиваемых часов, выше чек.","rubNote":"Цена в RUB — по курсу Нацбанка на 14.10.2026 (100 RUB = 3,6006 BYN). Для клиентов из России пересчитывай по курсу на день счёта.","sources":["npd-2026","npd-ilex","nbrb-rates"]},"resourcesMeta":{"intro":"Только реальные ресурсы со ссылками на официальные страницы. У каждого — язык, цена, уровень и дата проверки. Английские ресурсы удобно читать через встроенный переводчик браузера.","types":{"book":"Книги","course":"Курсы","youtube":"YouTube","site":"Сайты и насмотренность","tool":"Инструменты","telegram":"Telegram","orders":"Площадки для заказов","jobs":"Вакансии"},"levels":{"beginner":"Новичок","intermediate":"База","advanced":"Продвинутый"},"prices":{"free":"Бесплатно","freemium":"Есть бесплатная версия","paid":"Платно"},"certificates":"Про сертификаты: мы прочитали 58 вакансий без опыта и с опытом 1–3 года (14.10.2026) — сертификат не требовался ни в одной. Пройденные курсы упомянуты один раз, профильное образование — в нескольких вакансиях. Работодатели смотрят портфолио: курс ценен тем, какие работы после него появились.","certificatesSrc":["hh-ru","rabota-by"],"payNote":"Оплату платных курсов и подписок картой белорусского банка мы не проверяли: перед покупкой уточни в поддержке сервиса."},"resources":[{"id":"b-williams","title":"Дизайн. Книга для недизайнеров (4-е изд.)","author":"Робин Уильямс","type":"book","lang":"ru","price":"paid","priceNote":"Издательство «Питер»","level":"beginner","year":"2014","original":"The Non-Designer's Design Book","translation":"Перевод на русский","why":"Четыре принципа — контраст, повтор, выравнивание, близость — на простых примерах. Лучшая первая книга.","url":"https://www.piter.com/collection/dizayn/product/dizayn-kniga-dlya-nediz <script>
/* Путь в дизайн — офлайн-приложение. Данные: <script id="data">, прогресс: localStorage «anya-guide-v1». */
(function () {
  'use strict';

  const DATA = JSON.parse(document.getElementById('data').textContent);
  const M = DATA.meta;
  const HPW = (M.person && M.person.hoursPerWeek) || 7;
  const STORE_KEY = 'anya-guide-v1';

  const byId = (list) => Object.fromEntries(list.map((x) => [x.id, x]));
  const SRC = byId(DATA.sources);
  const RES = byId(DATA.resources);
  const DIR = byId(DATA.directions);
  const MS = byId(M.milestones);
  const TPL = byId([...DATA.firstOrders.templates, ...DATA.growth.templates, ...DATA.hiring.templates]);

  /* ---------- хранилище ---------- */
  const defaults = () => ({ v: 1, direction: null, steps: {}, checks: {}, quiz: null, theme: null, calc: null });
  let storageOk = true;
  function load() {
    try {
      localStorage.setItem(STORE_KEY + '-test', '1');
      localStorage.removeItem(STORE_KEY + '-test');
      const raw = localStorage.getItem(STORE_KEY);
      if (!raw) return defaults();
      const s = JSON.parse(raw);
      const out = Object.assign(defaults(), s && typeof s === 'object' ? s : {});
      if (!out.steps || typeof out.steps !== 'object') out.steps = {};
      if (!out.checks || typeof out.checks !== 'object') out.checks = {};
      if (out.direction && !DIR[out.direction]) out.direction = null;
      return out;
    } catch (e) {
      storageOk = false;
      return defaults();
    }
  }
  let state = load();
  function save() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(state));
      storageOk = true;
    } catch (e) {
      storageOk = false;
    }
    const note = document.getElementById('storage-note');
    if (note) note.hidden = storageOk;
  }

  /* ---------- HTML-помощники ---------- */
  const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ESC[c]);
  function Raw(s) { this.s = s; }
  const raw = (s) => new Raw(s);
  function out(v) {
    if (v == null || v === false) return '';
    if (v instanceof Raw) return v.s;
    if (Array.isArray(v)) return v.map(out).join('');
    return esc(v);
  }
  function html(strings, ...vals) {
    let s = strings[0];
    vals.forEach((v, i) => { s += out(v) + strings[i + 1]; });
    return raw(s);
  }
  const when = (cond, fn) => (cond ? fn() : '');

  const nf = (digits) => new Intl.NumberFormat('ru-RU', { minimumFractionDigits: digits, maximumFractionDigits: digits });
  const fmt0 = (x) => nf(0).format(x);
  const fmt1 = (x) => nf(1).format(x);
  const fmtN = (x) => new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 2 }).format(x);
  const fmtW = (w) => (Math.abs(w - Math.round(w)) < 0.05 ? fmt0(Math.round(w)) : fmt1(Math.round(w * 2) / 2));
  function fmtDate(iso) {
    if (!iso) return '';
    const p = String(iso).split('-');
    return p.length === 3 ? `${p[2]}.${p[1]}.${p[0]}` : iso;
  }
  const weekRange = (start, end) => { const a = Math.floor(start) + 1; const b = Math.max(Math.ceil(end), a); return a === b ? `неделя ${fmt0(a)}` : `недели ${fmt0(a)}–${fmt0(b)}`; };
  const plural = (n, one, few, many) => {
    const a = Math.abs(n) % 100, b = a % 10;
    if (a > 10 && a < 20) return many;
    if (b > 1 && b < 5) return few;
    if (b === 1) return one;
    return many;
  };

  const regMark = (cls = 'reg') => raw(`<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 1.5v21M1.5 12h21" stroke="currentColor" stroke-width="1.6"/></svg>`);

  function srcLinks(ids) {
    const list = [].concat(ids || []).map((id) => SRC[id]).filter(Boolean);
    if (!list.length) return '';
    const label = (s) => s.publisher + (s.date ? ', ' + fmtDate(s.date) : '');
    const dup = (s) => list.filter((x) => label(x) === label(s)).length > 1;
    return html`<p class="src">${list.length > 1 ? 'Источники' : 'Источник'}: ${list.map((s, i) => html`${i ? '; ' : ''}<a href="${s.url}" target="_blank" rel="noopener" title="${s.title}">${dup(s) ? s.title : s.publisher}</a>${s.date ? ', ' + fmtDate(s.date) : ''}`)}</p>`;
  }

  const list = (items, cls = '') => html`<ul class="${cls}">${items.map((x) => html`<li>${x}</li>`)}</ul>`;
  const olist = (items) => html`<ol>${items.map((x) => html`<li>${x}</li>`)}</ol>`;
  const sec = (key, title, body) => html`<section class="sec" id="sec-${key}"><h2>${title}</h2>${body}</section>`;
  const toc = (page, items) => html`<nav aria-label="Содержание раздела"><ul class="toc">${items.map(([k, t]) => html`<li><a href="#/${page}/${k}">${t}</a></li>`)}</ul></nav>`;

  function resMini(ids) {
    const items = [].concat(ids || []).map((id) => RES[id]).filter(Boolean);
    if (!items.length) return '';
    const T = DATA.resourcesMeta.types;
    return html`<ul class="res-mini">${items.map((r) => html`<li><a href="${r.url}" target="_blank" rel="noopener">${r.title}</a> <span class="badge">${T[r.type]}</span><span class="badge">${r.lang === 'en' ? 'EN' : 'RU'}</span><span class="badge">${DATA.resourcesMeta.prices[r.price]}</span><p>${r.why}</p></li>`)}</ul>`;
  }

  function checklist(items, group) {
    return html`<ul class="checklist" data-group="${group}">${items.map((c) => html`<li><label class="check"><input type="checkbox" data-check="${c.id}"${state.checks[c.id] ? raw(' checked') : ''}><span class="box" aria-hidden="true"></span><span class="check-text">${c.text}</span></label></li>`)}</ul>`;
  }
  const countChecks = (items) => items.filter((c) => state.checks[c.id]).length;

  function scales(sc, wide) {
    const rows = wide
      ? [['entry', 'Лёгкость входа'], ['ceiling', 'Потолок дохода'], ['hiring', 'Перспективы найма']]
      : [['entry', 'Вход'], ['ceiling', 'Потолок'], ['hiring', 'Найм']];
    return html`<dl class="scales${wide ? ' wide' : ''}">${rows.map(([k, label]) => html`<div class="scale"><dt>${label}</dt><dd><span class="pips" role="img" aria-label="${sc[k]} из 5">${[1, 2, 3, 4, 5].map((i) => raw(`<i class="${i <= sc[k] ? 'on' : ''}"></i>`))}</span><span class="num">${sc[k]}/5</span></dd></div>`)}</dl>`;

  /* ---------- роадмап: время и прогресс ---------- */
  function timeline(dir) {
    let acc = 0;
    const rows = dir.roadmap.map((s) => {
      const w = s.hours ? s.hours / HPW : s.weeks;
      const r = { s, w, start: acc, end: acc + w };
      acc += w;
      return r;
    });
    return { rows, total: acc };
  }
  function progressOf(dir) {
    const { rows, total } = timeline(dir);
    const doneRows = rows.filter((r) => state.steps[r.s.id]);
    const doneW = doneRows.reduce((a, r) => a + r.w, 0);
    return { rows, total, done: doneRows.length, pct: total ? (doneW / total) * 100 : 0 };
  }
  function ruler(dir) {
    const p = progressOf(dir);
    const ms = p.rows.filter((r) => r.s.milestone).map((r) => ({ m: MS[r.s.milestone], at: (r.end / p.total) * 100, end: r.end, done: !!state.steps[r.s.id] }));
    const label = `Пройдено ${Math.round(p.pct)}% пути: ${p.done} из ${p.rows.length} шагов`;
    return html`<div class="ruler" style="--sw:${dir.color};--total:${Math.round(p.total)}" data-pct="${p.pct.toFixed(2)}">
      <div class="ruler-track" role="progressbar" aria-label="${label}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(p.pct)}"><div class="ruler-fill"></div></div>
      ${ms.map((x) => html`<span class="mark${x.done ? ' is-done' : ''}" style="left:${x.at.toFixed(2)}%" title="${x.m.title}">${regMark()}</span>`)}
      <div class="ruler-scale" aria-hidden="true"><span>старт</span><span>≈ ${fmt0(Math.ceil(p.total))} нед.</span></div>
    </div>
    <ol class="ms-legend">${ms.map((x) => html`<li class="${x.done ? 'is-done' : ''}">${regMark()}<span><b>${x.m.title}</b> <span class="ms-when">— около ${fmt0(Math.ceil(x.end))}-й недели</span>${x.done ? html` <span class="ms-ok">· есть!</span>` : ''}</span></li>`)}</ol>
    <p class="progress-stats"><span>Шагов отмечено: ${p.done} из ${p.rows.length}</span><span>Пройдено пути: ${fmt0(p.pct)}%</span></p>`;
  }
  function animateRulers(root) {
    root.querySelectorAll('.ruler').forEach((r) => {
      const fill = r.querySelector('.ruler-fill');
      r.classList.add('animate');
      requestAnimationFrame(() => requestAnimationFrame(() => { fill.style.width = r.dataset.pct + '%'; }));

  }

  /* тест */
  function quizScores(answers) {
    const Q = DATA.quiz;
    const tot = Object.fromEntries(DATA.directions.map((d) => [d.id, 0]));
    for (const q of Q.questions) {
      const oi = answers[q.id];
      if (oi == null) continue;
      const o = q.options[oi];
      if (!o) continue;
      for (const [k, v] of Object.entries(o.w || {})) tot[k] += v;
      if (o.p) for (const d of DATA.directions) tot[d.id] += Q.priorityWeight * d.scores[o.p];
    }
    return Object.entries(tot).sort((a, b) => b[1] - a[1]);
  }
  function quizPick(answers) {
    const r = quizScores(answers);
    const picks = [r[0][0]];
    if (r[1][1] >= 0.85 * r[0][1]) picks.push(r[1][0]);
    return picks;
  }
  const quizAnswered = (answers) => DATA.quiz.questions.filter((q) => answers[q.id] != null).length;
  function quizResult(qs) {
    const Q = DATA.quiz;
    const a = qs.answers || {};
    const picked = Q.questions.map((q) => q.options[a[q.id]]).filter(Boolean);
    const motionInterest = picked.some((o) => (o.w || {}).motion >= 3);
    const weakPC = picked.some((o) => (o.w || {}).motion < 0);
    return html`<div class="result"><h2 tabindex="-1" id="result-title">${Q.resultTitle}</h2>
      ${qs.result.filter((id) => DIR[id]).map((id, i) => { const d = DIR[id]; return html`<article class="result-item" style="--sw:${d.color}"><div class="swatch-plate"></div><div class="inner">

        <div class="actions"><a class="btn btn-sm" href="#/direction/${id}">Открыть направление</a><button class="btn btn-sm btn-primary" type="button" data-pick-go="${id}">Выбрать для роадмапа</button></div></div></article>`; })}
      ${when(motionInterest && weakPC, () => html`<p class="alert">${Q.computerNote}</p>`)}
      <p class="note">${Q.resultNote}</p>
      <button class="btn btn-sm btn-quiet" type="button" data-action="quiz-reset">Пройти заново</button></div>`;
  }
  function pageQuiz() {

  /* заработок */
  function calcValues() {
    const v = {};
    for (const f of DATA.calculator.fields) {
      const s = state.calc && state.calc[f.id];
      v[f.id] = typeof s === 'number' && isFinite(s) ? s : f.default;
    }
    return v;
  }
  function clampValues(v) {
    const c = {};
    for (const f of DATA.calculator.fields) c[f.id] = Math.min(f.max, Math.max(f.min, Number(v[f.id]) || 0));
    return c;
  }
  function calcCompute(vIn) {
    const v = clampValues(vIn);
    const C = DATA.calculator;
    const billable = v.hoursWeek * C.weeksPerMonth * (v.share / 100);
    const base = v.desired + v.expenses;
    const t = Math.min(v.tax, 95) / 100;
    const byMin = base + v.minTax;
    const byRate = base / (1 - t);
    const gross = Math.max(byMin, byRate);
    const rate = billable > 0 ? gross / billable : 0;
    return { v, billable, base, gross, tax: gross - base, rate, minBinds: byMin >= byRate };
  }
  const toRub = (byn) => (byn / M.rates.RUB100) * 100;
  const rub10 = (byn) => Math.round(toRub(byn) / 10) * 10;
  let calcDir = null;
  function calcOutput(vals) {
    const C = DATA.calculator;
    const r = calcCompute(vals);
    const dirSel = calcDir === null ? state.direction || 'all' : calcDir;
    const tasks = C.tasks.filter((t) => dirSel === 'all' || t.direction === dirSel);
    const k = 1 + r.v.reserve / 100;
    return html`<p class="rate" id="calc-rate" data-rate="${r.rate.toFixed(4)}">${fmt1(r.rate)} BYN<small> в час · ≈ ${fmt0(rub10(r.rate))} ₽</small></p>
      <ul class="calc-lines">
        <li>Оплачиваемых часов в месяц: ${fmtN(r.v.hoursWeek)} × ${fmtN(C.weeksPerMonth)} × ${fmtN(r.v.share)}% ≈ <b>${fmt1(r.billable)} ч</b></li>
        <li>Нужная выручка: <b>${fmt0(Math.ceil(r.gross))} BYN</b> в месяц, из них налог ≈ ${fmt0(Math.ceil(r.tax))} BYN${r.minBinds ? ' (сработал минимальный налог)' : ''}</li>

      ${tasks.map((t) => { const p = r.rate * t.hours * k; return html`<tr><td data-label="Задача">${t.title}${dirSel === 'all' ? html` <span class="badge">${DIR[t.direction].title}</span>` : ''}</td><td class="r" data-label="Часы">${fmtN(t.hours)}</td><td class="r" data-label="Цена, BYN" data-price="${p.toFixed(2)}"><b>${fmt0(Math.round(p))}</b></td><td class="r" data-label="≈ RUB">${fmt0(rub10(p))}</td></tr>`; })}</tbody></table></div>`;
  }

  /* ресурсы */
  const resFilter = { q: '', dir: '', type: '', lang: '', price: '', level: '' };
  function resMatch(r) {
    const f = resFilter;
    if (f.dir && !(r.directions.includes(f.dir) || r.directions.includes('all'))) return false;
    if (f.type && r.type !== f.type) return false;
    if (f.lang && r.lang !== f.lang) return false;
    if (f.price === 'free' && r.price !== 'free') return false;
    if (f.price === 'freemium' && r.price !== 'freemium') return false;
    if (f.price === 'paid' && r.price !== 'paid') return false;
    if (f.level && r.level !== f.level) return false;
    if (f.q) {
      const hay = [r.title, r.author, r.why, r.priceNote, r.original, r.note].join(' ').toLowerCase().replace(/ё/g, 'е');
      const words = f.q.toLowerCase().replace(/ё/g, 'е').split(/\s+/).filter(Boolean);
      if (!words.every((w) => hay.includes(w))) return false;
    }
    return true;
  }
  const PURPOSE = { orders: 'заказы', jobs: 'вакансии', community: 'сообщество' };

    ].filter(([, v]) => v);
    return html`<article class="res" data-res="${r.id}"><h3><a href="${r.url}" target="_blank" rel="noopener">${r.title}</a></h3>
      <p class="res-meta">${r.author}</p>

      <p>${r.why}</p><dl class="kv">${extra.map(([k, v]) => html`<dt>${k}</dt><dd>${v}</dd>`)}<dt>Проверено</dt><dd>${fmtDate(r.checked)}</dd></dl>${srcLinks(r.src)}</article>`;

    const countEl = document.getElementById('res-count');
    if (!listEl) return;
    listEl.innerHTML = items.length ? out(items.map(resCard)) : '<p>Ничего не нашлось. Попробуй убрать часть фильтров.</p>';
    countEl.textContent = `Найдено: ${items.length} из ${DATA.resources.length}`;
  }
  function pageResources() {
    const RM = DATA.resourcesMeta;
    const sel = (key, label, opts) => html`<label>${label}<select data-filter="${key}"><option value="">Все</option>${opts.map(([v, t]) => html`<option value="${v}"${resFilter[key] === v ? raw(' selected') : ''}>${t}</option>`)}</select></label>`;
    return html`<header class="page-head"><h1 tabindex="-1">Ресурсы</h1><p class="lead">${RM.intro}</p></header>
      <div class="search"><label for="res-q">Поиск</label><input id="res-q" type="search" data-filter="q" value="${resFilter.q}" placeholder="Например: Figma, типографика, вакансии" autocomplete="off"></div>
      <div class="filters">
        ${sel('dir', 'Направление', DATA.directions.map((d) => [d.id, d.title]))}
        ${sel('type', 'Тип', Object.entries(RM.types))}
        ${sel('lang', 'Язык', [['ru', 'Русский'], ['en', 'English']])}
        ${sel('price', 'Цена', Object.entries(RM.prices))}
        ${sel('level', 'Уровень', Object.entries(RM.levels))}
      </div>
      <div class="actions no-print"><button class="btn btn-sm btn-quiet" type="button" data-action="filters-reset">Сбросить фильтры</button></div>
      <p class="count" id="res-count" aria-live="polite"></p>
      <div class="res-list" id="res-list"></div>
      <h2>Про сертификаты и оплату</h2><p>${RM.certificates}</p>${srcLinks(RM.certificatesSrc)}<p class="note">${RM.payNote}</p>`;
  }

  function pageNotFound() {
    return html`<h1 tabindex="-1">Страница не найдена</h1><p><a href="#/home">На главную</a></p>`;
  }

  /* ---------- роутер ---------- */
  const NAV = [
    ['home', 'Главная'], ['quiz', 'Тест: какое направление'], ['directions', 'Направления'], ['foundation', 'Фундамент'], ['roadmap', 'Роадмап'],
    ['orders', 'Первые заказы'], ['growth', 'Заработок на фрилансе'], ['hiring', 'Переход в найм'], ['resources', 'Ресурсы'],
  ];
  const PAGES = { home: pageHome, quiz: pageQuiz, directions: pageDirections, foundation: pageFoundation, roadmap: pageRoadmap, orders: pageOrders, growth: pageGrowth, hiring: pageHiring, resources: pageResources };

  function parseHash() {
    const h = (location.hash || '').replace(/^#\/?/, '');
    const parts = h.split('/').filter(Boolean).map(decodeURIComponent);
    if (!parts.length) return { page: 'home', arg: null, sub: null };
    if (parts[0] === 'direction') return { page: 'direction', arg: parts[1] || null, sub: parts[2] || null };
    return { page: parts[0], arg: null, sub: parts[1] || null };
  }

  function renderNav(page) {
    const active = page === 'direction' ? 'directions' : page;
    document.getElementById('nav').innerHTML = out(html`<ol>${NAV.map(([k, t], i) => html`<li><a href="#/${k}"${k === active ? raw(' aria-current="page"') : ''}><span class="nav-n">${i + 1}</span><span>${t}</span></a></li>`)}</ol>`);
  }

  let firstRender = true;
  let lastPageKey = '';
  function render() {
    const r = parseHash();
    const main = document.getElementById('main');
    const pageKey = r.page + '/' + (r.arg || '');
    const samePage = pageKey === lastPageKey;
    let body;
    if (r.page === 'direction') body = pageDirection(r.arg);
    else body = (PAGES[r.page] || pageNotFound)();
    const title = r.page === 'direction' && DIR[r.arg] ? DIR[r.arg].title : (NAV.find(([k]) => k === r.page) || [null, ''])[1];
    const storageBanner = storageOk ? '' : html`<p class="alert storage-banner no-print" role="status">Браузер не даёт сохранять прогресс (например, в приватном режиме или во встроенном просмотре мессенджера). Отметки пропадут после закрытия вкладки — открой файл в обычном браузере.</p>`;
    main.innerHTML = out(html`<p class="print-head">${M.title} · ${title} · актуально на ${M.actualLabel}</p>`) + out(storageBanner) + out(body) +
      out(html`<footer class="page-foot"><button class="btn btn-sm" type="button" data-action="print">Сохранить раздел как PDF</button><span>Актуально на ${M.actualLabel}. Прогресс хранится в этом браузере.</span></footer>`);
    document.title = (r.page === 'home' ? '' : title + ' — ') + M.title;
    renderNav(r.page);
    closeMenu();
    animateRulers(main);
    if (r.page === 'resources') renderResList();
    lastPageKey = pageKey;
    if (r.sub) {
      const el = document.getElementById('sec-' + r.sub);
      if (el) {
        if (el.tagName === 'DETAILS') el.open = true;
        el.scrollIntoView();
      }
    } else if (!samePage) {
      window.scrollTo(0, 0);
      if (!firstRender) {
        const h1 = main.querySelector('h1');
        if (h1) h1.focus({ preventScroll: true });
      }
    }
    firstRender = false;
  }

  /* ---------- меню на телефоне ---------- */
  const sidebar = document.getElementById('sidebar');
  const scrim = document.getElementById('scrim');
  const menuBtn = document.getElementById('menu-btn');
  function openMenu() {
    sidebar.classList.add('open');
    scrim.hidden = false;
    menuBtn.setAttribute('aria-expanded', 'true');
    const first = sidebar.querySelector('a, button');
    if (first) first.focus();
  }
  function closeMenu() {
    if (!sidebar.classList.contains('open')) return;
    sidebar.classList.remove('open');
    scrim.hidden = true;
    menuBtn.setAttribute('aria-expanded', 'false');
  }
  menuBtn.addEventListener('click', openMenu);
  document.getElementById('menu-close').addEventListener('click', () => { closeMenu(); menuBtn.focus(); });
  scrim.addEventListener('click', closeMenu);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMenu(); });

  /* ---------- тема ---------- */
  const systemDark = () => window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  const currentTheme = () => state.theme || (systemDark() ? 'dark' : 'light');
  function applyTheme() {
    if (state.theme) document.documentElement.setAttribute('data-theme', state.theme);
    else document.documentElement.removeAttribute('data-theme');
    const dark = currentTheme() === 'dark';
    const btn = document.getElementById('theme-btn');
    if (btn) btn.textContent = dark ? 'Светлая тема' : 'Тёмная тема';
    document.querySelectorAll('[data-action="theme"]').forEach((b) => b.setAttribute('aria-label', dark ? 'Включить светлую тему' : 'Включить тёмную тему'));
  }

  /* ---------- уведомления и копирование ---------- */
  let toastTimer = 0;
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
  }
  function copyFallback(text) {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.top = '-1000px';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      const ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch (e) {
      return false;
    }
  }
  async function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      try {
        await navigator.clipboard.writeText(text);
        return true;
      } catch (e) { /* дальше — запасной способ */ }
    }
    return copyFallback(text);
  }

  function doPrint() {
    toast('В окне печати выбери «Сохранить как PDF»');
    setTimeout(() => window.print(), 350);
  }

  /* ---------- события ---------- */
  function refreshCounts() {
    for (const s of STAGES) {
      document.querySelectorAll(`[data-count="${s.group}"]`).forEach((el) => {
        const n = countChecks(s.items);
        el.textContent = el.tagName === 'P' ? `Отмечено ${n} из ${s.items.length}` : `${n} из ${s.items.length}`;
      });
    }
  }
  function refreshRulers() {
    const d = DIR[state.direction];
    if (!d) return;
    document.querySelectorAll('#main .ruler').forEach((r) => {
      const legend = r.nextElementSibling;
      const stats = legend && legend.nextElementSibling;
      const tmp = document.createElement('div');
      tmp.innerHTML = out(ruler(d));
      const [nr, nl, ns] = tmp.children;
      nr.querySelector('.ruler-fill').style.width = r.querySelector('.ruler-fill').style.width;
      nr.classList.add('animate');
      r.replaceWith(nr);
      if (legend && legend.classList.contains('ms-legend')) legend.replaceWith(nl);
      if (stats && stats.classList.contains('progress-stats')) stats.replaceWith(ns);
      requestAnimationFrame(() => { nr.querySelector('.ruler-fill').style.width = nr.dataset.pct + '%'; });
    });
  }

  document.addEventListener('change', (e) => {
    const t = e.target;
    if (t.matches('input[data-check]')) {
      if (t.checked) state.checks[t.dataset.check] = true; else delete state.checks[t.dataset.check];
      save();
      refreshCounts();
    } else if (t.matches('input[data-step]')) {
      if (t.checked) state.steps[t.dataset.step] = true; else delete state.steps[t.dataset.step];
      save();
      refreshRulers();
    } else if (t.matches('#quiz input[type="radio"]')) {
      const answers = Object.assign({}, state.quiz && state.quiz.answers);
      answers[t.name] = Number(t.value);
      state.quiz = { answers, result: state.quiz && state.quiz.result ? state.quiz.result : null };
      save();
      const left = DATA.quiz.questions.length - quizAnswered(answers);
      document.getElementById('quiz-left').textContent = left ? `Осталось ответить: ${left}` : 'Все вопросы отвечены';
    } else if (t.matches('select[data-filter]')) {
      resFilter[t.dataset.filter] = t.value;
      renderResList();
    }
  });

  document.addEventListener('input', (e) => {
    const t = e.target;
    if (t.matches('input[data-calc]')) {
      const v = parseFloat(String(t.value).replace(',', '.'));
      state.calc = Object.assign({}, state.calc);
      if (isFinite(v)) state.calc[t.dataset.calc] = v; else delete state.calc[t.dataset.calc];
      save();
      document.getElementById('calc-out').innerHTML = out(calcOutput(calcValues()));
    } else if (t.matches('input[data-filter="q"]')) {
      resFilter.q = t.value.trim();
      renderResList();
    }
  });

  document.addEventListener('submit', (e) => {
    if (e.target.id !== 'quiz') return;
    e.preventDefault();
    const answers = (state.quiz && state.quiz.answers) || {};
    const left = DATA.quiz.questions.length - quizAnswered(answers);
    if (left) {
      toast(`Ответь ещё на ${left} ${plural(left, 'вопрос', 'вопроса', 'вопросов')}`);
      const firstEmpty = DATA.quiz.questions.find((q) => answers[q.id] == null);
      const el = firstEmpty && document.querySelector(`input[name="${firstEmpty.id}"]`);
      if (el) { el.closest('fieldset').scrollIntoView({ block: 'center' }); el.focus({ preventScroll: true }); }
      return;
    }
    state.quiz = { answers, result: quizPick(answers), at: new Date().toISOString().slice(0, 10) };
    save();
    document.getElementById('quiz-result').innerHTML = out(quizResult(state.quiz));
    const h = document.getElementById('result-title');
    h.scrollIntoView();
    h.focus({ preventScroll: true });
  });

  document.addEventListener('click', async (e) => {
    const el = e.target.closest('button, a');
    if (!el) return;
    const ds = el.dataset;
    if (ds.copy) {
      const t = TPL[ds.copy];
      const ok = await copyText(t.lines.join('\n'));
      toast(ok ? 'Скопировано' : 'Не получилось скопировать — выдели текст и скопируй вручную');
    } else if (ds.pick) {
      state.direction = ds.pick;
      save();
      render();
    } else if (ds.pickGo) {
      state.direction = ds.pickGo;
      save();
      toast('Направление выбрано');
      if (location.hash === '#/roadmap') render(); else location.hash = '#/roadmap';
    } else if (ds.calcDir) {
      calcDir = ds.calcDir;
      document.getElementById('calc-out').innerHTML = out(calcOutput(calcValues()));
    } else if (ds.action === 'theme') {
      state.theme = currentTheme() === 'dark' ? 'light' : 'dark';
      save();
      applyTheme();
    } else if (ds.action === 'print') {
      doPrint();
    } else if (ds.action === 'reset') {
      if (window.confirm('Сбросить весь прогресс: отметки шагов и чек-листов, результат теста и выбранное направление? Отменить это будет нельзя.')) {
        state = Object.assign(defaults(), { theme: state.theme, calc: state.calc });
        save();
        render();
        toast('Прогресс сброшен');
      }
    } else if (ds.action === 'quiz-reset') {
      state.quiz = null;
      save();
      render();
    } else if (ds.action === 'calc-reset') {
      state.calc = null;
      save();
      render();
      const c = document.getElementById('sec-calc');
      if (c) c.scrollIntoView();
    } else if (ds.action === 'filters-reset') {
      Object.keys(resFilter).forEach((k) => { resFilter[k] = ''; });
      render();
    }
  });

  if (window.matchMedia) {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) mq.addEventListener('change', applyTheme);
  }
  window.addEventListener('hashchange', render);
  window.addEventListener('beforeprint', () => document.querySelectorAll('#main details').forEach((d) => { d.dataset.wasOpen = d.open ? '1' : ''; d.open = true; }));
  window.addEventListener('afterprint', () => document.querySelectorAll('#main details').forEach((d) => { if (d.dataset.wasOpen === '') d.open = false; }));
  window.addEventListener('storage', (e) => { if (e.key === STORE_KEY) { state = load(); render(); } });

  // Для автотестов: чистые функции расчёта.
  window.__guide = { calcCompute, quizPick, quizScores, timeline, state: () => state };

  save();
  applyTheme();
  render();
})();

</script>
</body>
</html>
